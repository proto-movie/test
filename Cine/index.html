<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineNear — London Cinema Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="cinema_data.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  /* Apple Design System */
  --primary:           #0066cc;
  --primary-focus:     #0071e3;
  --primary-on-dark:   #2997ff;
  --ink:               #1d1d1f;
  --ink-muted-80:      #333333;
  --ink-muted-48:      #7a7a7a;
  --hairline:          #e0e0e0;
  --canvas:            #ffffff;
  --parchment:         #f5f5f7;
  --surface-pearl:     #fafafc;
  --surface-black:     #000000;
  --on-dark:           #ffffff;

  /* Legacy aliases used in JS-generated inline styles */
  --green:  #3cd68a;
  --amber:  #f0a030;
  --text3:  #7a7a7a;

  /* Map/marker palette (dark CARTO tiles) */
  --map-bg:      #080810;
  --map-surface: #0f0f1a;
  --map-elevated:#161625;
  --map-card:    #1c1c2e;
  --map-border:  #252538;
  --map-border2: #2e2e48;
  --map-text:    #ece8f5;
  --map-green:   #3cd68a;
  --map-blue:    #88aaff;
  --map-purple:  #bb99ff;
  --map-amber:   #f0a030;
  --map-amber2:  #c97e1a;
  --map-text3:   #5a5680;
}

html, body { height: 100%; overflow: hidden; }
body {
  background: var(--parchment);
  color: var(--ink);
  font-family: system-ui, -apple-system, sans-serif;
  display: flex; flex-direction: column;
}

/* ─── Global Nav ─────────────────────────────────────────────── */
header {
  height: 44px; min-height: 44px;
  background: var(--canvas);
  border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center;
  padding: 0 20px; gap: 16px; z-index: 200;
}
.logo {
  font-size: 14px; font-weight: 600;
  color: var(--ink); letter-spacing: -0.224px;
}

.hdr-sep { flex: 1; }
.hdr-stat { font-size: 12px; color: var(--ink-muted-48); letter-spacing: -0.12px; }
.hdr-stat strong { color: var(--primary); font-weight: 400; }

/* ─── Layout ─────────────────────────────────────────────────── */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ─── MAP SIDE ───────────────────────────────────────────────── */
.map-side { flex: 1; position: relative; min-width: 0; }
#map { width: 100%; height: 100%; background: var(--map-bg); }

/* Leaflet overrides */
.leaflet-container { background: var(--parchment); }
.leaflet-control-zoom {
  border: 1px solid var(--hairline) !important;
  border-radius: 11px !important; overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.14) !important;
}
.leaflet-control-zoom a {
  background: var(--canvas) !important; color: var(--ink-muted-80) !important;
  border-color: var(--hairline) !important;
  width: 32px !important; height: 32px !important;
  line-height: 32px !important; font-size: 16px !important;
}
.leaflet-control-zoom a:hover { background: var(--parchment) !important; color: var(--ink) !important; }
.leaflet-control-attribution {
  background: rgba(245,245,247,0.82) !important; color: var(--ink-muted-48) !important; font-size: 9px !important;
}
.leaflet-control-attribution a { color: var(--primary) !important; }
.leaflet-popup-content-wrapper {
  background: var(--canvas) !important;
  border: 1px solid var(--hairline) !important;
  border-radius: 11px !important;
  box-shadow: 0 4px 24px rgba(0,0,0,0.13) !important;
  padding: 0 !important;
}
.leaflet-popup-content {
  margin: 0 !important; padding: 10px 14px !important;
  font-family: system-ui, -apple-system, sans-serif !important;
  font-size: 13px !important; color: var(--ink) !important;
}
.leaflet-popup-tip-container { display: none !important; }
.popup-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; letter-spacing: -0.374px; }
.popup-dist { font-size: 12px; color: var(--primary); letter-spacing: -0.12px; }

/* ─── Date selector (map overlay, top) ──────────────────────── */
.date-panel {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 1000;
  background: rgba(245,245,247,0.84);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid rgba(0,0,0,0.07);
  border-radius: 18px;
  padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
  white-space: nowrap;
}
.dp-label { font-size: 12px; letter-spacing: -0.12px; color: var(--ink-muted-48); flex-shrink: 0; }
.dp-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.dp-scroll::-webkit-scrollbar { display: none; }
.dbtn {
  background: var(--surface-pearl);
  border: 1px solid var(--hairline);
  color: var(--ink-muted-80);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 13px; letter-spacing: -0.224px;
  padding: 6px 14px; border-radius: 9999px; cursor: pointer;
  transition: background 0.15s, color 0.15s; white-space: nowrap; flex-shrink: 0;
  outline: none;
}
.dbtn:hover { background: var(--parchment); color: var(--ink); }
.dbtn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.dbtn:active { transform: scale(0.95); }

/* ─── Radius info (map overlay, bottom-left) ────────────────── */
.radius-panel {
  position: absolute; bottom: 20px; left: 20px; z-index: 1000;
  background: rgba(245,245,247,0.84);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid rgba(0,0,0,0.07);
  border-radius: 9999px;
  padding: 8px 16px;
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; letter-spacing: -0.12px;
}
.rp-val { color: var(--ink); font-weight: 600; }
.rp-sep { color: var(--ink-muted-48); }

/* ─── Map markers ────────────────────────────────────────────── */
.user-marker {
  width: 18px; height: 18px; background: var(--primary);
  border: 3px solid rgba(255,255,255,0.9); border-radius: 50%;
  animation: pulse-m 2.2s infinite;
}
@keyframes pulse-m {
  0%   { box-shadow: 0 0 0 0   rgba(0,102,204,0.55); }
  70%  { box-shadow: 0 0 0 16px rgba(0,102,204,0); }
  100% { box-shadow: 0 0 0 0   rgba(0,102,204,0); }
}
@keyframes pulse-c {
  0%   { box-shadow: 0 0 0 0    rgba(34,197,94,0.65); }
  70%  { box-shadow: 0 0 0 14px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0    rgba(34,197,94,0); }
}
.cinema-dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.85);
  background: #22c55e;
  box-shadow: 0 1px 4px rgba(34,197,94,0.4);
  cursor: pointer; transition: transform 0.15s;
}
.cinema-dot:hover { transform: scale(1.5); }
.cinema-dot.dim { background: #5b9bd5; border-color: rgba(255,255,255,0.85); box-shadow: 0 1px 4px rgba(91,155,213,0.35); }
.cinema-dot.closest { background: #22c55e; border-color: rgba(255,255,255,0.95); animation: pulse-c 2.2s infinite; }
.cinema-dot.near2   { background: #22c55e; border-color: rgba(255,255,255,0.95); animation: pulse-c 2.6s infinite; }
.cinema-dot.near3   { background: #22c55e; border-color: rgba(255,255,255,0.95); animation: pulse-c 3.0s infinite; }

/* ─── PHONE SIDE ─────────────────────────────────────────────── */
.phone-side {
  width: 560px; min-width: 560px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--parchment);
  border-left: 1px solid var(--hairline);
  padding: 16px;
  gap: 12px;
}

/* ─── Phone frame ────────────────────────────────────────────── */
.phone-frame {
  width: 410px;
  height: calc(100vh - 44px - 56px);
  min-height: 680px;
  max-height: 880px;
  background: #080810;
  border-radius: 46px;
  position: relative;
  box-shadow:
    0 0 0 1px #1e1e34,
    0 0 0 3px #131326,
    0 0 0 5px #0a0a1c,
    0 28px 60px rgba(0,0,0,0.22),
    inset 0 0 0 1px rgba(255,255,255,0.04);
  overflow: hidden;
  flex-shrink: 0;
}
.phone-frame::before {
  content: ''; position: absolute; left: -4px; top: 100px;
  width: 4px; height: 32px; background: #1a1a2e; border-radius: 2px 0 0 2px;
  box-shadow: 0 46px 0 #1a1a2e;
}
.phone-frame::after {
  content: ''; position: absolute; right: -4px; top: 120px;
  width: 4px; height: 56px; background: #1a1a2e; border-radius: 0 2px 2px 0;
}

/* Dynamic island */
.dynamic-island {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 118px; height: 34px; background: #000;
  border-radius: 20px; z-index: 10;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
}

/* Screen — light mode interior */
.screen {
  position: absolute; inset: 0;
  border-radius: 46px;
  overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--canvas);
}

/* Status bar — dark icons on white */
.status-bar {
  height: 52px; padding: 14px 26px 0;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; background: var(--canvas);
}
.status-time { font-size: 15px; font-weight: 600; color: var(--ink); }
.status-icons { display: flex; align-items: center; gap: 5px; }
.status-icons svg { fill: var(--ink); }

/* App bar */
.app-bar {
  padding: 6px 22px 12px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--hairline);
  background: var(--canvas);
  display: flex; align-items: flex-end; gap: 10px;
}
.app-bar-title {
  font-size: 28px; font-weight: 600;
  letter-spacing: -0.374px; line-height: 1.1;
  color: var(--ink); flex-shrink: 0;
}

.location-info { flex: 1; min-width: 0; padding-bottom: 4px; }
.loc-cinema {
  font-size: 12px; font-weight: 600; color: var(--ink-muted-48);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: -0.12px;
}
.loc-meta { font-size: 11px; color: var(--ink-muted-48); margin-top: 1px; display: flex; gap: 8px; }
.loc-dist { color: var(--primary); }
.loc-count { color: var(--ink-muted-48); }

/* Tab bar */
.tab-bar {
  display: flex; flex-shrink: 0;
  background: var(--parchment);
  border-bottom: 1px solid var(--hairline);
}
.tab {
  flex: 1; padding: 11px 0;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 13px; font-weight: 400; letter-spacing: -0.224px;
  color: var(--ink-muted-48); text-align: center; cursor: pointer;
  border: none; border-bottom: 2px solid transparent;
  background: none; transition: color 0.15s; outline: none;
}
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tab:not(.active):hover { color: var(--ink-muted-80); }

/* Screen content */
.screen-content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: var(--hairline) transparent;
  background: var(--canvas);
}
.screen-content::-webkit-scrollbar { width: 3px; }
.screen-content::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 2px; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Home bar */
.home-bar {
  height: 30px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; background: var(--canvas);
}
.home-line { width: 110px; height: 4px; background: var(--ink); border-radius: 2px; opacity: 0.18; }

/* ─── Empty state ────────────────────────────────────────────── */
.empty {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 40px 20px; text-align: center; gap: 10px;
}
.empty-icon { font-size: 36px; opacity: 0.22; }
.empty-ttl { font-size: 17px; font-weight: 600; color: var(--ink); letter-spacing: -0.374px; }
.empty-sub { font-size: 14px; color: var(--ink-muted-48); line-height: 1.43; letter-spacing: -0.224px; }

/* ─── WHAT'S ON ──────────────────────────────────────────────── */
.wo-list { padding: 0; }

.wo-date-divider {
  padding: 10px 18px 8px;
  font-size: 17px; font-weight: 600; color: var(--ink); letter-spacing: -0.374px;
  background: var(--canvas);
  position: sticky; top: 0; z-index: 3;
  border-bottom: 1px solid var(--hairline);
}

.wo-film {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--hairline);
  cursor: pointer; transition: background 0.1s;
  background: var(--canvas);
}
.wo-film:hover { background: var(--parchment); }
.wo-film:last-child { border-bottom: none; }

.wo-film-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.wo-film-title {
  font-size: 17px; font-weight: 600; color: var(--ink);
  line-height: 1.24; flex: 1; min-width: 0; letter-spacing: -0.374px;
}
.wo-film-cert {
  font-size: 10px; font-weight: 600;
  padding: 3px 7px; border-radius: 9999px; flex-shrink: 0;
  line-height: 1.4; letter-spacing: 0.04em; margin-top: 2px;
}

/* Cinema rows within a film card */
.wo-cinema-row { margin-top: 4px; }
.wo-cinema-name {
  font-size: 11px; font-weight: 600; color: var(--ink-muted-48);
  letter-spacing: -0.12px; margin-bottom: 4px;
}
.wo-times { display: flex; flex-wrap: wrap; gap: 5px; }
.wo-time-chip {
  font-size: 11px;
  background: rgba(0,102,204,0.07); color: var(--primary);
  padding: 3px 9px; border-radius: 9999px;
  letter-spacing: -0.08px; font-weight: 500;
  border: 1px solid rgba(0,102,204,0.16);
}

/* ─── Cert badges ────────────────────────────────────────────── */
.fi-cert {
  font-size: 10px; font-weight: 600;
  padding: 2px 7px; border-radius: 9999px; flex-shrink: 0;
  line-height: 1.4; letter-spacing: 0.04em;
  align-self: flex-start; margin-top: 3px;
}
.cert-U    { background: rgba(60,214,138,0.12); color: #1a7a4a; border: 1px solid rgba(60,214,138,0.28); }
.cert-PG   { background: rgba(60,214,138,0.08); color: #287a40; border: 1px solid rgba(60,214,138,0.2); }
.cert-12A,
.cert-12   { background: rgba(240,160,48,0.1);  color: #8a5a00; border: 1px solid rgba(240,160,48,0.24); }
.cert-15   { background: rgba(255,112,64,0.1);  color: #a03010; border: 1px solid rgba(255,112,64,0.24); }
.cert-18   { background: rgba(255,68,102,0.1);  color: #aa0030; border: 1px solid rgba(255,68,102,0.24); }
.cert-R18  { background: rgba(255,34,68,0.1);   color: #cc0020; border: 1px solid rgba(255,34,68,0.24); }
.cert-     { background: var(--parchment); color: var(--ink-muted-48); border: 1px solid var(--hairline); }

/* ─── GO NOW ─────────────────────────────────────────────────── */
.gn-cinema-section { border-bottom: 1px solid var(--hairline); }
.gn-cinema-section:last-child { border-bottom: none; }

.gn-cinema-hdr {
  padding: 12px 18px 10px;
  background: var(--parchment);
  position: sticky; top: 0; z-index: 4;
  border-bottom: 1px solid var(--hairline);
}
.gn-cinema-rank {
  font-size: 11px; font-weight: 400; color: var(--ink-muted-48);
  letter-spacing: -0.08px; margin-bottom: 2px;
}
.gn-cinema-rank.r1 { color: #16a34a; }
.gn-cinema-rank.r2 { color: #16a34a; }
.gn-cinema-rank.r3 { color: #16a34a; }
.gn-cinema-rank.r4 { color: var(--ink-muted-48); }

.gn-cinema-name {
  font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -0.374px;
}
.gn-cinema-addr {
  font-size: 11px; color: var(--ink-muted-48); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.08px;
}
.gn-cinema-dist { font-size: 12px; margin-top: 3px; letter-spacing: -0.12px; color: var(--ink-muted-48); }
.gn-cinema-dist.r1 { color: #16a34a; }
.gn-cinema-dist.r2 { color: #16a34a; }
.gn-cinema-dist.r3 { color: #16a34a; }
.gn-cinema-dist.r4 { color: var(--ink-muted-48); }

.gn-no-shows {
  padding: 14px 18px;
  font-size: 13px; color: var(--ink-muted-48); font-style: italic; letter-spacing: -0.224px;
}

/* Film card inside Go Now */
.gn-film {
  padding: 12px 18px 10px;
  border-bottom: 1px solid rgba(224,224,224,0.55);
  cursor: pointer; transition: background 0.1s;
  background: var(--canvas);
}
.gn-film:hover { background: var(--parchment); }
.gn-film:last-child { border-bottom: none; }
.gn-film.all-past { opacity: 0.42; }

.gn-film-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 7px; }
.gn-title {
  font-size: 15px; font-weight: 600; color: var(--ink);
  line-height: 1.24; flex: 1; min-width: 0; letter-spacing: -0.374px;
}
.gn-film.all-past .gn-title { color: var(--ink-muted-48); }

/* Time chips row */
.gn-times { display: flex; flex-wrap: wrap; gap: 5px; }

.gn-chip {
  font-size: 12px; font-weight: 500;
  padding: 4px 11px; border-radius: 9999px;
  letter-spacing: -0.12px; white-space: nowrap;
}
.gn-chip.past {
  background: var(--parchment); color: var(--ink-muted-48);
  border: 1px solid var(--hairline);
}
.gn-chip.upcoming {
  background: rgba(0,102,204,0.07); color: var(--primary);
  border: 1px solid rgba(0,102,204,0.18);
}
.gn-chip.next {
  background: var(--primary); color: #fff;
  border: 1px solid var(--primary); font-size: 13px;
}
.gn-chip.soon {
  background: rgba(0,102,204,0.12); color: var(--primary);
  border: 1px solid rgba(0,102,204,0.28);
}

.gn-badge {
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.06em; padding: 2px 7px; border-radius: 9999px;
  flex-shrink: 0; text-transform: uppercase; white-space: nowrap; align-self: center;
}
.gn-chip.next .gn-badge.next {
  background: rgba(255,255,255,0.22); color: #fff; border: 1px solid rgba(255,255,255,0.35);
}
.gn-badge.next {
  background: rgba(0,102,204,0.1); color: var(--primary); border: 1px solid rgba(0,102,204,0.22);
}
.gn-badge.soon {
  background: rgba(0,102,204,0.07); color: var(--primary); border: 1px solid rgba(0,102,204,0.18);
}

/* Legend */
.legend {
  display: flex; gap: 14px;
  font-size: 11px; color: var(--ink-muted-48); letter-spacing: -0.08px;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* Transition */
.screen-content { transition: opacity 0.12s; }
.screen-content.fade { opacity: 0; }
</style>
</head>
<body>

<!-- Global Nav -->
<header>
  <div class="logo">London Cinemas &amp; Listings</div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat"><strong id="hdr-c">66</strong> cinemas · <strong id="hdr-s">18,411</strong> showtimes</div>
</header>

<div class="layout">

  <!-- ─── MAP ─────────────────────────────────────────────────── -->
  <div class="map-side">
    <div id="map"></div>

    <!-- Date selector -->
    <div class="date-panel">
      <span class="dp-label">Date</span>
      <div class="dp-scroll" id="date-btns"></div>
    </div>

    <!-- Radius info -->
    <div class="radius-panel">
      <span class="rp-val" id="rp-radius">—</span>
      <span class="rp-sep">·</span>
      <span class="rp-val" id="rp-cinemas">—</span>
      <span class="rp-sep">cinemas</span>
      <span class="rp-sep">·</span>
      <span class="rp-val" id="rp-films">—</span>
      <span class="rp-sep">films</span>
    </div>
  </div>

  <!-- ─── PHONE ────────────────────────────────────────────────── -->
  <div class="phone-side">
    <div class="phone-frame">
      <div class="dynamic-island"></div>
      <div class="screen">

        <!-- Status bar -->
        <div class="status-bar">
          <span class="status-time" id="status-time">18:42</span>
          <div class="status-icons">
            <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx="1" opacity="0.3"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="1" opacity="0.5"/><rect x="9" y="3" width="3" height="9" rx="1" opacity="0.7"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/><path d="M4 7.3a5.2 5.2 0 0 1 7 0" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M1.3 4.6a9 9 0 0 1 12.4 0" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="21" height="10" rx="2.5" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="22" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.4"/></svg>
          </div>
        </div>

        <!-- App bar -->
        <div class="app-bar">
          <div class="app-bar-title">Nearby</div>
        </div>

        <!-- Tabs -->
        <div class="tab-bar">
          <button class="tab active" data-tab="whats-on">What's On</button>
          <button class="tab" data-tab="go-now">Go Now</button>
        </div>

        <!-- Content -->
        <div class="screen-content" id="screen-content">
          <div class="tab-panel active" id="panel-whats-on">
            <div class="empty"><div class="empty-icon">🎬</div><div class="empty-ttl">Finding cinemas…</div><div class="empty-sub">Click the map to set your location</div></div>
          </div>
          <div class="tab-panel" id="panel-go-now">
            <div class="empty"><div class="empty-icon">⏱</div><div class="empty-ttl">Go Now</div><div class="empty-sub">Next screenings at the closest cinema</div></div>
          </div>
        </div>

        <div class="home-bar"><div class="home-line"></div></div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>CLOSEST</div>
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>2ND</div>
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>3RD</div>
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>IN RANGE</div>
      <div class="legend-item"><div class="legend-dot" style="background:#5b9bd5"></div>OUT</div>
    </div>
  </div>
</div>

<script>
// ─── Utils ────────────────────────────────────────────────────────────────────

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function haversineKm(lat1,lng1,lat2,lng2) {
  const R=6371, dL=(lat2-lat1)*Math.PI/180, dN=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dN/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function fmtDist(km) { return km<1 ? `${Math.round(km*1000)}m` : `${km.toFixed(1)}km`; }

function certCls(c) {
  if (!c) return 'cert-';
  const v = c.trim().replace(/\s/g,'');
  if (v==='U') return 'cert-U';
  if (v==='PG') return 'cert-PG';
  if (['12A','12'].includes(v)) return 'cert-12A';
  if (v==='15') return 'cert-15';
  if (v==='18') return 'cert-18';
  if (v==='R18') return 'cert-R18';
  return 'cert-';
}

function compareTime(a,b) { return a.localeCompare(b); }

function addMins(t, m) {
  const [h,n]=t.split(':').map(Number), tot=h*60+n+m;
  return `${String(Math.floor(tot/60)%24).padStart(2,'0')}:${String(tot%60).padStart(2,'0')}`;
}
function minsUntil(now,then) {
  const [nh,nm]=now.split(':').map(Number),[th,tm]=then.split(':').map(Number);
  return Math.max(0,(th*60+tm)-(nh*60+nm));
}

function formatDayLabel(d) {
  return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();
}

// ─── State ────────────────────────────────────────────────────────────────────

const cinemas = window.CINEMA_DATA?.cinemas || [];
let userLat=51.5115, userLng=-0.1289, radiusKm=1, activeTab='whats-on';

// Build available dates from data
const allDates = [...new Set(cinemas.flatMap(c=>Object.keys(c.s)))].sort().filter(d=>d>='2026-06-04');

let selectedDate = allDates[1] || allDates[0] || '2026-06-05';

// Demo "now" time — treat data's first date as today, 14:00 as current time
const DEMO_NOW = '14:00';
const DEMO_TODAY = allDates[0] || '2026-06-04';

// ─── Date buttons ─────────────────────────────────────────────────────────────

const dateBtnsEl = document.getElementById('date-btns');

function buildDateButtons() {
  const days = allDates.slice(1, 7);
  dateBtnsEl.innerHTML = days.map(d => {
    const label = new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    return `<button class="dbtn${d===selectedDate?' active':''}" data-date="${d}">${label}</button>`;
  }).join('');

  dateBtnsEl.querySelectorAll('.dbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedDate = btn.dataset.date;
      dateBtnsEl.querySelectorAll('.dbtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      updateAll();
    });
  });
}
buildDateButtons();

// ─── Map setup ────────────────────────────────────────────────────────────────

// London bounding box: SW corner ~51.28,-0.56  NE corner ~51.73,0.34
const LONDON_BOUNDS = L.latLngBounds([51.28, -0.56], [51.73, 0.34]);

const map = L.map('map', {
  center: [userLat, userLng],
  zoom: 13,
  minZoom: 10,
  maxZoom: 17,
  maxBounds: LONDON_BOUNDS,
  maxBoundsViscosity: 0.9,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'© <a href="https://carto.com">CARTO</a> © <a href="https://openstreetmap.org">OSM</a>',
  subdomains:'abcd', maxZoom:19,
}).addTo(map);

const userIcon = L.divIcon({className:'',html:'<div class="user-marker"></div>',iconSize:[18,18],iconAnchor:[9,9]});
const userMarker = L.marker([userLat,userLng],{icon:userIcon,draggable:true,zIndexOffset:1000}).addTo(map);

let radiusCircle = L.circle([userLat,userLng],{
  radius:radiusKm*1000, color:'rgba(0,102,204,0.5)',
  fillColor:'rgba(0,102,204,0.06)', fillOpacity:1,
  weight:1.5, dashArray:'6 4',
}).addTo(map);

userMarker.on('drag',e=>{
  userLat=e.latlng.lat; userLng=e.latlng.lng;
  radiusCircle.setLatLng([userLat,userLng]);
  debouncedUpdate(); // circle radius recalculated inside updateAll
});
userMarker.on('dragend',()=>updateAll());

map.on('click',e=>{
  userLat=e.latlng.lat; userLng=e.latlng.lng;
  userMarker.setLatLng([userLat,userLng]);
  radiusCircle.setLatLng([userLat,userLng]);
  updateAll();
});

// Cinema markers
const cinemaMarkers=new Map();
cinemas.forEach(c=>{
  const icon=L.divIcon({className:'',html:'<div class="cinema-dot dim"></div>',iconSize:[10,10],iconAnchor:[5,5]});
  const m=L.marker([c.c[0],c.c[1]],{icon,zIndexOffset:400}).addTo(map);
  m.bindPopup(`<div class="popup-name">${c.n}</div><div class="popup-dist" id="pp${sanitize(c.n)}">—</div>`,{offset:[0,-4]});
  cinemaMarkers.set(c.n,m);
});
function sanitize(s){return s.replace(/[^a-zA-Z0-9]/g,'_');}

// ─── Tabs ─────────────────────────────────────────────────────────────────────

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); activeTab=t.dataset.tab;
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById(`panel-${activeTab}`).classList.add('active');
  });
});

// ─── Core update ──────────────────────────────────────────────────────────────

let debTimer=null;
function debouncedUpdate(){clearTimeout(debTimer);debTimer=setTimeout(updateAll,80);}

function updateAll() {
  const ranked = cinemas.map(c=>({...c,km:haversineKm(userLat,userLng,c.c[0],c.c[1])}))
    .sort((a,b)=>a.km-b.km);

  // Circle radius: at least radiusKm, but expand to always contain the 3rd nearest cinema
  const thirdKm = ranked[2]?.km ?? radiusKm;
  const effectiveRadius = Math.max(radiusKm, thirdKm);

  const inRange = ranked.filter(c => c.km <= effectiveRadius);
  radiusCircle.setRadius(effectiveRadius * 1000);

  // Count unique films across in-range cinemas for the selected date
  const filmSet = new Set();
  inRange.forEach(c => {
    let shows = c.s[selectedDate] || [];
    if (!shows.length) {
      const next = Object.keys(c.s).sort().find(d => d > selectedDate);
      if (next) shows = c.s[next] || [];
    }
    shows.forEach(([title]) => filmSet.add(title));
  });

  document.getElementById('rp-radius').textContent = fmtDist(effectiveRadius);
  document.getElementById('rp-cinemas').textContent = inRange.length;
  document.getElementById('rp-films').textContent = filmSet.size;

  // Update markers — top 3 always lit, rest dim beyond effective radius
  ranked.forEach((c, i) => {
    const marker = cinemaMarkers.get(c.n);
    if (!marker) return;
    const dot = marker.getElement()?.querySelector('.cinema-dot');
    if (!dot) return;
    dot.className = 'cinema-dot';
    if (i === 0) dot.classList.add('closest');
    else if (i === 1) dot.classList.add('near2');
    else if (i === 2) dot.classList.add('near3');
    else if (c.km > effectiveRadius) dot.classList.add('dim');
    marker.getPopup()?.setContent(`<div class="popup-name">${c.n}</div><div class="popup-dist">${fmtDist(c.km)}</div>`);
  });

  const closest = ranked[0];

  // Fade + render
  const sc = document.getElementById('screen-content');
  sc.classList.add('fade');
  setTimeout(()=>{
    renderWhatsOn(inRange, selectedDate);
    renderGoNow(inRange, selectedDate);
    sc.classList.remove('fade');
  }, 100);
}

// ─── WHAT'S ON: deduplicated film list ────────────────────────────────────────

function renderWhatsOn(cinemas, date) {
  const panel = document.getElementById('panel-whats-on');
  const isToday = date === DEMO_TODAY;
  const now = DEMO_NOW;

  if (!cinemas.length) {
    panel.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-ttl">No cinemas</div><div class="empty-sub">Move the pin to find cinemas</div></div>`;
    return;
  }

  // Collect unique film titles from all in-range cinemas
  // Fall forward to next available date per cinema if needed
  const filmMap = new Map();
  cinemas.forEach(c => {
    let shows = c.s[date] || [];
    if (!shows.length) {
      const next = Object.keys(c.s).sort().find(d => d > date);
      if (next) shows = c.s[next] || [];
    }
    shows.forEach(([title, cert]) => {
      if (!filmMap.has(title)) filmMap.set(title, cert);
    });
  });

  if (!filmMap.size) {
    panel.innerHTML = `<div class="empty"><div class="empty-icon">📅</div><div class="empty-ttl">Nothing on</div><div class="empty-sub">No films at these cinemas</div></div>`;
    return;
  }

  const films = [...filmMap.entries()]
    .map(([title, cert]) => ({ title, cert }))
    .sort((a, b) => a.title.localeCompare(b.title));

  let html = `<div class="wo-list"><div class="wo-date-divider">${films.length} films · ${cinemas.length} cinemas</div>`;

  films.forEach(f => {
    html += `<div class="wo-film">
      <div class="wo-film-top">
        <div class="wo-film-title">${esc(f.title)}</div>
        <span class="wo-film-cert fi-cert ${certCls(f.cert)}">${f.cert||'—'}</span>
      </div>
    </div>`;
  });

  html += '</div>';
  panel.innerHTML = html;
}

// ─── GO NOW: 3 nearest cinemas, unique films with time chips ─────────────────

function rankLabel(i) {
  const n = i + 1;
  const s = n === 1 ? 'ST' : n === 2 ? 'ND' : n === 3 ? 'RD' : 'TH';
  return `${n}${s} CLOSEST`;
}
function rankClass(i) {
  return i <= 2 ? `r${i + 1}` : 'r4';
}

function renderGoNow(cinemas, date) {
  const panel = document.getElementById('panel-go-now');
  const isToday = date === DEMO_TODAY;
  const now = DEMO_NOW;

  if (!cinemas.length) {
    panel.innerHTML = `<div class="empty"><div class="empty-icon">⏱</div><div class="empty-ttl">Go Now</div><div class="empty-sub">Move pin to find cinemas near you</div></div>`;
    return;
  }

  let html = '';

  cinemas.forEach((cinema, rank) => {
    // If no data for selected date, fall forward to next available date
    let displayDate = date;
    let shows = cinema.s[date] || [];
    let usingFallback = false;

    if (!shows.length) {
      const nextDate = Object.keys(cinema.s).sort().find(d => d > date);
      if (nextDate) {
        displayDate = nextDate;
        shows = cinema.s[nextDate] || [];
        usingFallback = true;
      }
    }

    const distLabel = usingFallback
      ? `${fmtDist(cinema.km)} away · <span style="color:var(--amber)">next: ${formatDayLabel(displayDate)}</span>`
      : `${fmtDist(cinema.km)} away`;

    html += `<div class="gn-cinema-section">
      <div class="gn-cinema-hdr">
        <div class="gn-cinema-rank ${rankClass(rank)}">${rankLabel(rank)}</div>
        <div class="gn-cinema-name">${esc(cinema.n)}</div>
        <div class="gn-cinema-addr">${esc(cinema.a)}</div>
        <div class="gn-cinema-dist ${rankClass(rank)}">${distLabel}</div>
      </div>`;

    if (!shows.length) {
      html += `<div class="gn-no-shows">No screenings found for this cinema</div>`;
    } else {
      // Group by film title → collect all times
      const filmMap = new Map();
      shows.forEach(([title, cert, time]) => {
        if (!filmMap.has(title)) filmMap.set(title, { cert, times: [] });
        filmMap.get(title).times.push(time);
      });

      const films = [...filmMap.entries()].map(([title, d]) => ({
        title, cert: d.cert, times: d.times.sort(),
      })).sort((a,b) => a.times[0].localeCompare(b.times[0]));

      const showingToday = displayDate === DEMO_TODAY;
      let globalNextTime = null;
      if (showingToday) {
        const upcoming = films.flatMap(f => f.times).filter(t => compareTime(t, now) >= 0).sort();
        globalNextTime = upcoming[0] || null;
      }

      films.forEach(f => {
        const allPast = showingToday && f.times.every(t => compareTime(t, now) < 0);
        html += `<div class="gn-film${allPast?' all-past':''}">
          <div class="gn-film-top">
            <div class="gn-title">${esc(f.title)}</div>
            <span class="fi-cert ${certCls(f.cert)}" style="margin-top:4px">${f.cert||'—'}</span>
          </div>
          <div class="gn-times">`;
        f.times.forEach(time => {
          const isPast = showingToday && compareTime(time, now) < 0;
          const isNext = showingToday && time === globalNextTime;
          const isSoon = showingToday && !isPast && !isNext && minsUntil(now, time) <= 90;
          let cls = 'gn-chip' + (isPast?' past':isNext?' next':isSoon?' soon':' upcoming');
          const label = isNext
            ? `${time} <span class="gn-badge next" style="margin-left:3px">NOW</span>`
            : isSoon ? `${time} <span style="font-size:9px;opacity:0.7"> ${minsUntil(now,time)}m</span>`
            : time;
          html += `<span class="${cls}">${label}</span>`;
        });
        html += '</div></div>';
      });
    }

    html += '</div>';
  });

  panel.innerHTML = html;
}

// ─── Clock ────────────────────────────────────────────────────────────────────

function tick() {
  const n=new Date();
  document.getElementById('status-time').textContent=
    `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}
tick(); setInterval(tick,30000);

// ─── Init ─────────────────────────────────────────────────────────────────────

setTimeout(()=>updateAll(), 500);
</script>
</body>
