        const json = JSON.parse(text.slice(text.indexOf('(') + 1, text.lastIndexOf(')')));
        const rows = json.table.rows;
        if (!rows || !rows.length) return;
        const header = rows[0].c.map(c => c && c.v); // ["EN","FR","DE","IT","NL","LATAM","ES","PT","TR"]
        const langCols = header.slice(1);
        const map = {};
        for (let i = 1; i < rows.length; i++) {
          const cells = rows[i].c;
          if (!cells || !cells[0] || !cells[0].v) continue;
          const key = String(cells[0].v).trim().toUpperCase();
          const entry = {};
          langCols.forEach((lang, idx) => {
            const cell = cells[idx + 1];
            if (cell && cell.v) entry[lang] = String(cell.v);
          });
          map[key] = entry;
        }
        sheetTitles = map;
        if (currentLang !== 'EN') applyLanguage(currentLang); // refresh anything already on screen with live data
      } catch (err) {
        console.warn('[debug menu] Could not load live translations from the sheet — using embedded fallback.', err);
      }
    }

    function titleFor(film, lang) {
      if (lang === 'EN') return film.title;
      const live = sheetTitles && sheetTitles[film.title.trim().toUpperCase()];
      if (live && live[lang]) return live[lang];
      return (film.titles && film.titles[lang]) || film.title; // embedded fallback, then EN
    }

    // Synopsis comes from the F_DESCRIPTION tab (not the MUBI API's own
    // synopsis text — that's a different, unrelated editorial copy). Same
    // live-with-embedded-fallback pattern as titleFor(): film.synopsis is
    // the F_DESCRIPTION tab's EN column, baked into filmDatabase above;
    // sheetSynopses is that whole tab fetched live by loadSheetSynopses().
    //
    // F_DESCRIPTION's header row (row 1 of the sheet) names each language
    // column, same as FILM_TITLE — read dynamically here (not a fixed
    // column-position guess) so renaming/reordering columns in the sheet
    // (e.g. fixing a mislabeled "ES" column to "LATAM") is picked up
    // automatically on the next load, with no code change needed.
    const SYNOPSIS_JSON_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=F_DESCRIPTION&tqx=out:json`;
    let sheetSynopses = null; // { "THE SUBSTANCE": { FR: "...", DE: "...", ... }, ... } once loaded

    async function loadSheetSynopses() {
      try {
        const res = await fetch(SYNOPSIS_JSON_URL);
        const text = await res.text();
        const json = JSON.parse(text.slice(text.indexOf('(') + 1, text.lastIndexOf(')')));
        const rows = json.table.rows;
        if (!rows || !rows.length) return;
        // Column 0 is the film-title row label ("FILM TITLE"); columns from
        // 1 onward are whatever language codes row 1 currently has.
        const header = rows[0].c.map(c => (c && c.v) ? String(c.v).trim().toUpperCase() : null);
        const langCols = header.slice(1);
        const map = {};
        for (let i = 1; i < rows.length; i++) {
          const cells = rows[i].c;
          if (!cells || !cells[0] || !cells[0].v) continue;
          const key = String(cells[0].v).trim().toUpperCase();
          const entry = {};
          langCols.forEach((lang, idx) => {
            if (!lang) return;
            const cell = cells[idx + 1];
            if (cell && cell.v) entry[lang] = String(cell.v);
          });
          map[key] = entry;
        }
        sheetSynopses = map;
        if (currentLang !== 'EN') applyLanguage(currentLang);
      } catch (err) {
        console.warn('[debug menu] Could not load live synopses from the sheet — using embedded fallback.', err);
      }
    }

    function synopsisFor(film, lang) {
      if (lang === 'EN') return film.synopsis;
      const live = sheetSynopses && sheetSynopses[film.title.trim().toUpperCase()];
      if (live && live[lang]) return live[lang];
      return film.synopsis; // no embedded per-language fallback for synopsis — EN until the sheet loads
    }

    // Time-of-day slot labels (Opening Feature, Twilight Zone, ...) come
    // from the TOD tab, one row per slot in the same fixed order as SLOTS
    // above — so slot index (not film title) is the join key here. Same
    // live-with-embedded-fallback pattern as titleFor()/synopsisFor():
    // SLOTS[i].timeLabel is the embedded EN fallback, sheetSlotLabels is
    // the live-fetched sheet. Some languages (e.g. FR, LATAM) don't have
    // every row translated yet in the sheet — those fall back to EN too.
    const TOD_JSON_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=TOD&tqx=out:json`;
    let sheetSlotLabels = null; // [ { EN:"OPENING FEATURE", FR:"...", ... }, ... ] one per slot, in SLOTS order

    async function loadSlotLabels() {
      try {
        const res = await fetch(TOD_JSON_URL);
        const text = await res.text();
        const json = JSON.parse(text.slice(text.indexOf('(') + 1, text.lastIndexOf(')')));
        const rows = json.table.rows;
        if (!rows || !rows.length) return;
        const header = rows[0].c.map(c => (c && c.v) ? String(c.v).trim().toUpperCase() : null);
        const list = [];
        for (let i = 1; i < rows.length; i++) {
          const cells = rows[i].c;
          const entry = {};
          header.forEach((lang, idx) => {
            if (!lang) return;
            const cell = cells[idx];
            if (cell && cell.v) entry[lang] = String(cell.v);
          });
          list.push(entry);
        }
        sheetSlotLabels = list;
        if (currentLang !== 'EN') applyLanguage(currentLang);
      } catch (err) {
        console.warn('[debug menu] Could not load live time-of-day labels from the sheet — using embedded fallback.', err);
      }
    }

    function slotLabelFor(slotIndex, lang) {
      const fallback = (SLOTS[slotIndex] || SLOTS[SLOTS.length - 1]).timeLabel;
      if (lang === 'EN') return fallback;
      const live = sheetSlotLabels && sheetSlotLabels[slotIndex] && sheetSlotLabels[slotIndex][lang];
      return live || fallback;
    }

    // Intro-panel copy (the headline + quote shown before scrolling into the
    // film list) comes from the INTRO_PAGE tab — only its "heading" and
    // "quote" rows are wired up (the sheet has a couple of other rows too,
    // for copy that isn't on this page). Same live-with-embedded-fallback
    // pattern as everything else above.
    const INTRO_JSON_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=INTRO_PAGE&tqx=out:json`;
    const INTRO_FALLBACK = {
      heading: "Gather your friends, it's time for a Halloween sleepover film marathon.",
      quote: "If it gets too real, you can always turn it off."
    };

    // Breaks a line in two right after its first comma (e.g. "Gather your
    // friends, it's time..." -> "Gather your friends,\nit's time...") — only
    // where a comma actually exists to break at; text with none (some
    // languages phrase this without one) is left as a single line rather
    // than force an awkward break.
    function breakAfterFirstComma(text) {
      const idx = text.indexOf(',');
      if (idx === -1) return text;
      return text.slice(0, idx + 1) + '\n' + text.slice(idx + 1).trimStart();
    }

    // Same first-comma break for line 1, then splits whatever's left into a
    // roughly balanced two more lines at the nearest word boundary to its
    // midpoint — a language-agnostic stand-in for "the next natural break,"
    // since only the first break is marked by punctuation.
    // Nearest space to a target character index (searching outward both
    // ways), so a cut always lands on a word boundary.
    function nearestSpace(text, target) {
      let best = -1, bestDiff = Infinity;
      for (let i = 0; i < text.length; i++) {
        if (text[i] !== ' ') continue;
        const diff = Math.abs(i - target);
        if (diff < bestDiff) { bestDiff = diff; best = i; }
      }
      return best;
    }

    function breakIntoThreeLines(text) {
      if (text.length < 20) return text; // short enough as one line
      const third = text.length / 3;
      const commaIdx = text.indexOf(',');
      // A comma close to the ideal first-third mark reads as the more
      // natural break; anywhere else it'd make line 1 lopsided and risk
      // wrapping past three lines on narrower screens, so fall back to a
      // plain even split instead.
      const cut1 = (commaIdx !== -1 && Math.abs(commaIdx - third) < text.length * 0.2)
        ? commaIdx + 1
        : nearestSpace(text, third);
      if (cut1 === -1) return text;
      const cut2 = nearestSpace(text, text.length * 2 / 3);
      if (cut2 === -1 || cut2 <= cut1) return text.slice(0, cut1).trim() + '\n' + text.slice(cut1).trim();
      return text.slice(0, cut1).trim() + '\n' + text.slice(cut1, cut2).trim() + '\n' + text.slice(cut2).trim();
    }
    let sheetIntro = null; // { heading: { EN:"...", FR:"...", ... }, quote: { ... } }

    // The sheet's "quote" row has an editorial note like " [Camp Miasma
    // quote]" tacked onto some cells (EN, LATAM, ES) — not meant to display —
    // plus each language wraps the line in its own quote-mark style (“ ”,
    // « », „ “, etc). Strip both: the bracketed note, then a leading and
    // trailing quote mark in any of those styles (order-agnostic around a
    // trailing period, since some languages put the period inside the
    // marks and some put it outside).
    const QUOTE_CHARS = '"“”„«»\'‘’';
    function cleanIntroText(s) {
      let text = String(s || '').replace(/\s*\[[^\]]*\]\s*$/, '').trim();
      text = text.replace(new RegExp(`^[${QUOTE_CHARS}]\\s*`), '');
      text = text.replace(new RegExp(`(\\.)\\s*[${QUOTE_CHARS}]$`), '$1');
      text = text.replace(new RegExp(`[${QUOTE_CHARS}]\\s*(\\.)$`), '$1');
      text = text.replace(new RegExp(`\\s*[${QUOTE_CHARS}]$`), '');
      return text.trim();
    }

    async function loadIntroText() {
      try {
        const res = await fetch(INTRO_JSON_URL);
        const text = await res.text();
        const json = JSON.parse(text.slice(text.indexOf('(') + 1, text.lastIndexOf(')')));
        const rows = json.table.rows;
        if (!rows || !rows.length) return;
        // Column 0 is a row key ("heading", "quote", or blank for the
        // sheet's other, unrelated copy rows); columns from 1 on are
        // whatever language codes row 1 currently has.
        const header = rows[0].c.map(c => (c && c.v) ? String(c.v).trim().toUpperCase() : null);
        const langCols = header.slice(1);
        const map = {};
        for (let i = 1; i < rows.length; i++) {
          const cells = rows[i].c;
          const key = (cells && cells[0] && cells[0].v) ? String(cells[0].v).trim().toLowerCase() : '';
          if (!key) continue; // only "heading" and "quote" rows are keyed — skip the rest
          const entry = {};
          langCols.forEach((lang, idx) => {
            if (!lang) return;
            const cell = cells[idx + 1];
            if (cell && cell.v) entry[lang] = cleanIntroText(cell.v);
          });
          map[key] = entry;
        }
        sheetIntro = map;
        if (currentLang !== 'EN') applyLanguage(currentLang);
      } catch (err) {
        console.warn('[debug menu] Could not load live intro text from the sheet — using embedded fallback.', err);
      }
    }

    function introFor(key, lang) {
      const breaker = key === 'heading' ? breakIntoThreeLines : breakAfterFirstComma;
      const fallback = INTRO_FALLBACK[key];
      if (lang === 'EN') return breaker(fallback);
      const live = sheetIntro && sheetIntro[key] && sheetIntro[key][lang];
      return breaker(live || fallback);
    }

    // Title card over the loading flash, per language. Spanish splits into
    // its two files (ES → Spain, LATAM → Latin America); anything without
    // its own file falls back to English.
    const TITLE_CARD_FILES = {
      EN: 'EN', FR: 'FR', DE: 'DE', IT: 'IT', NL: 'NL',
      LATAM: 'ES-LATAM', ES: 'ES-ES', PT: 'PT', TR: 'TR',
    };
    function titleCardFor(lang) {
      return `images/Halloween-26_TT_${TITLE_CARD_FILES[lang] || 'EN'}_WHITE.png`;
    }

    function applyLanguage(lang) {
      currentLang = lang;
      const flashLogo = document.getElementById('flashLogo');
      if (flashLogo) flashLogo.src = titleCardFor(lang);
      const labels     = document.querySelectorAll('.time-label');       // left-menu: time-of-day slot names
      const slotEls    = document.querySelectorAll('.film-slot-label');  // same, inside the expanded tile
      const titleEls   = document.querySelectorAll('.film-title');
      const imgs       = document.querySelectorAll('.tile-image img');
      const synopsisEls = document.querySelectorAll('.film-synopsis');
      const introLead  = document.querySelector('.intro-lead');
      const introQuote = document.querySelector('.intro-quote');
      if (introLead)  introLead.textContent  = introFor('heading', lang);
      if (introQuote) introQuote.textContent = introFor('quote', lang);
      films.forEach((film, i) => {
        const t = titleFor(film, lang);
        const slotLabel = slotLabelFor(i, lang);
        if (labels[i])   labels[i].textContent = slotLabel;
        if (slotEls[i])  slotEls[i].textContent = slotLabel;
        if (titleEls[i]) titleEls[i].textContent = t;
        if (imgs[i])     imgs[i].alt = t;
        if (synopsisEls[i]) synopsisEls[i].textContent = synopsisFor(film, lang);
      });
    }

    // ── Debug menu: region selector ──
    // Region codes mirror the header row of the REGIONS tab. That tab's
    // rows below the header are each region's 8-slot lineup (see
    // regionsData/buildFilmsForRegion above); selecting a region here
    // rebuilds the whole carousel around that lineup — see applyRegion().
    const REGIONS_JSON_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=Regions&tqx=out:json`;
    let currentRegion = 'UK & IE';
    let films = buildFilmsForRegion(currentRegion); // rebuilt whenever the region changes

    // Auto-detect the visitor's region from their IP (GeoIP), same idea as
    // detectPreferredLanguage() but for country instead of browser language —
    // there's no browser API for "what country is this visitor in", so this
    // asks a couple of free GeoIP lookup services instead. Two providers in
    // sequence (not just one) because free GeoIP APIs rate-limit aggressively
    // and we'd rather silently fall through to the default region than show
    // an error. Any country recognized but not one of the named regions
    // (e.g. Spain, which is distinct from LATAM's Latin America) lands on
    // ROW, the catch-all — see ROW_LINEUP and regionForCountry() below.
    const GEOIP_PROVIDERS = [
      { url: 'https://get.geojs.io/v1/ip/country.json', countryCode: d => d.country },
      { url: 'https://ipapi.co/json/', countryCode: d => d.country_code || d.country },
    ];
    const SPLATAM_COUNTRY_CODES = new Set([
      'AR', 'BO', 'CL', 'CO', 'CR', 'CU', 'DO', 'EC', 'GT',
      'HN', 'MX', 'NI', 'PA', 'PE', 'PR', 'PY', 'SV', 'UY', 'VE'
    ]);
    const REGION_BY_COUNTRY = {
      GB: 'UK & IE', IE: 'UK & IE',
      NL: 'NL', IT: 'IT', TR: 'TR', US: 'US', CA: 'CA', DE: 'DE', BR: 'BR', FR: 'FR', AU: 'AU'
    };
    function regionForCountry(cc) {
      if (!cc) return null; // lookup told us nothing — keep the default rather than guessing
      cc = cc.toUpperCase();
      if (SPLATAM_COUNTRY_CODES.has(cc)) return 'LATAM';
      return REGION_BY_COUNTRY[cc] || 'ROW'; // a known country, just not one of the named regions
    }
    async function detectRegionFromIP() {
      for (const provider of GEOIP_PROVIDERS) {
        try {
          const res = await fetch(provider.url);
          if (!res.ok) continue;
          const data = await res.json();
          const region = regionForCountry(provider.countryCode(data));
          if (region) return region;
        } catch (err) {
          // try the next provider
        }
      }
      return null;
    }

    // A REGIONS-tab cell doesn't always spell a title exactly like
    // filmDatabase's key (e.g. the sheet has "HAGAZUSSA: A HEATHEN'S CURSE"
    // where filmDatabase — matching the shorter FILM_TITLE tab — just has
    // "HAGAZUSSA"). Exact match first, then fall back to a prefix match so
    // small subtitle differences like that one don't break the lookup.
    function normalizeFilmKey(raw) {
      const key = String(raw).trim().toUpperCase();
      if (filmDatabase[key]) return key;
      const found = Object.keys(filmDatabase).find(k => key.startsWith(k) || k.startsWith(key));
      return found || key;
    }

    // The live sheet's REGIONS tab column header may still read "SpLatam"
    // (renamed to LATAM everywhere client-side, but that's a manual edit
    // on the sheet itself) — relabel it here so the dropdown always shows
    // "LATAM" regardless, while keeping the option's value matching
    // whatever key the sheet actually uses so lookups elsewhere still work.
    function regionDisplayLabel(region) {
      return region === 'SpLatam' ? 'LATAM' : region;
    }

    function populateRegionOptions(regionList) {
      // ROW is client-side-only (see ROW_LINEUP above) — keep it in the
      // dropdown even though the live sheet doesn't know about it.
      if (!regionList.includes('ROW')) regionList = [...regionList, 'ROW'];
      const select = document.getElementById('regionSelect');
      const prevValue = select.value;
      select.innerHTML = regionList.map(r => `<option value="${r}">${regionDisplayLabel(r)}</option>`).join('');
      select.value = regionList.includes(prevValue) ? prevValue
        : (regionList.includes(currentRegion) ? currentRegion : regionList[0]);
    }

    // Rebuilds `films` for the given region and re-renders the whole
    // carousel around it, resetting to the intro (the running order changed
    // under it, so mid-carousel scroll position no longer means anything).
    function applyRegion(region) {
      currentRegion = region;
      films = buildFilmsForRegion(currentRegion);
      renderFilms();
      if (currentLang !== 'EN') applyLanguage(currentLang);
      enterIntro();
      // getBoundingClientRect() (inside syncColumnCenter) forces a synchronous
      // layout, so this doesn't need to wait for a paint frame — measuring
      // right away is what makes startLoading's positions correct instead of
      // stale ones left over from the previous region. The intro text that
      // used to live here (prompting a manual scroll to load) has moved to
      // the hero, so replay the load-in animation right away instead of
      // leaving an empty screen until the next scroll.
      syncColumnCenter();
      if (inFilmSection) startLoading();
    }

    async function loadRegionsData() {
      try {
        const res = await fetch(REGIONS_JSON_URL);
        const text = await res.text();
        const json = JSON.parse(text.slice(text.indexOf('(') + 1, text.lastIndexOf(')')));
        const rows = json.table.rows;
        if (!rows || !rows.length) return;
        const header = rows[0].c.map(c => c && c.v).filter(Boolean); // region codes
        const map = {};
        header.forEach(region => { map[region] = []; });
        for (let i = 1; i < rows.length; i++) {
          const cells = rows[i].c;
          header.forEach((region, colIdx) => {
            const cell = cells[colIdx];
            if (cell && cell.v) map[region].push(normalizeFilmKey(cell.v));
          });
        }
        if (!map['ROW']) map['ROW'] = regionsData['ROW'] || ROW_LINEUP; // sheet doesn't have this column — keep it
        regionsData = map;
        populateRegionOptions(header);
        applyRegion(currentRegion); // refresh what's on screen with the live lineup
      } catch (err) {
        console.warn('[debug menu] Could not load live region lineups from the sheet — using embedded fallback.', err);
      }
    }

    let activeIndex = -1;
    let phase = 'intro'; // 'intro' | 'loading' | 'list'
    let inFilmSection = false;
    let inFooterSection = false;
    let columnLeftX = null; // horizontal center of the film-image column, where the list settles
    let sectionTransitionLock = false;
    // Mutable — kept in sync with the current viewport (desktop vs mobile) by
    // updateResponsiveVars(), which also mirrors these into the --tile-w/
    // --active-h/etc CSS custom properties so the carousel's own JS layout
    // math and the CSS it's painted with never disagree.
    let LOAD_BOX_W = 363, LOAD_BOX_H = 204.1875; // size (16:9) every still is revealed at during loading
    const VERTICAL_SHIFT = -100; // shifts the loader and settled list up together
    function centerY() { return window.innerHeight / 2 + VERTICAL_SHIFT; }

    const MOBILE_BREAKPOINT = 768;  // keep in sync with the CSS @media rules
    const TABLET_BREAKPOINT = 1100; // keep in sync with the CSS @media rule
    function isMobile() { return window.innerWidth <= MOBILE_BREAKPOINT; }
    function isTablet() { return window.innerWidth > MOBILE_BREAKPOINT && window.innerWidth <= TABLET_BREAKPOINT; }

    // Recomputes every size the carousel depends on for the current viewport
    // and mirrors it into CSS custom properties. Called on load and resize,
    // before syncColumnCenter() (which depends on these).
    function updateResponsiveVars() {
      const root = document.documentElement.style;
      if (isMobile()) {
        const w = window.innerWidth; // stills run edge-to-edge on mobile, no side margin
        const imgH = Math.round(w * 9 / 16);
        // Info overlays the bottom of the still rather than stacking below
        // it, but the active still still grows taller than a compact one —
        // a portrait-like hero crop (object-fit:cover fills the extra
        // height), with the overlay sitting over the bottom of it.
        const activeExtraH = 380;
        LOAD_BOX_W = w;
        LOAD_BOX_H = imgH;
        ACTIVE_H = imgH + activeExtraH;
        COMPACT_H = imgH;
        TILE_GAP = 16;
        root.setProperty('--nav-w', '0px');
        root.setProperty('--tile-w', w + 'px');
        root.setProperty('--tile-h', imgH + 'px');
        root.setProperty('--active-w', w + 'px');
        root.setProperty('--active-h', (imgH + activeExtraH) + 'px');
        root.setProperty('--active-img-w', w + 'px');
      } else if (isTablet()) {
        // The desktop's fixed 1042px active width (600px image + 442px
        // side text panel) doesn't fit below ~1100px, so — like mobile —
        // the tile becomes fluid width and the info overlays the image's
        // bottom instead (see the shared 1100px CSS media query) rather
        // than sitting beside it. Active height is a flat 70% of the
        // viewport rather than image-height-plus-text-budget, so it stays
        // a fixed proportion of the screen regardless of how wide/tall
        // that particular viewport is.
        //
        // Nav keeps the same 360px as desktop — that's the value tuned
        // (see .time-label's padding) to fit every language's longest
        // label at this same 16px size without ellipsis-clipping (Spanish's
        // "Largometraje de Media Noche" is the longest). Shrinking it just
        // for tablet clipped titles the same way a narrower value did
        // before. The tile takes whatever's left.
        const navW = 360;
        const rightPad = 64; // matches .film-area's fixed padding-right
        const tileW = Math.max(320, Math.round(window.innerWidth - navW - rightPad));
        const imgH = Math.round(tileW * 9 / 16);
        LOAD_BOX_W = tileW;
        LOAD_BOX_H = imgH;
        ACTIVE_H = Math.round(window.innerHeight * 0.7);
        COMPACT_H = imgH;
        TILE_GAP = 20;
        root.setProperty('--nav-w', navW + 'px');
        root.setProperty('--tile-w', tileW + 'px');
        root.setProperty('--tile-h', imgH + 'px');
        root.setProperty('--active-w', tileW + 'px');
        root.setProperty('--active-h', ACTIVE_H + 'px');
        root.setProperty('--active-img-w', tileW + 'px');
      } else {
        // Desktop's side-by-side layout (image | info panel) wants 1042px
        // for the active tile (nav-w 360 + active-w 1042 + film-area's own
        // 64px right padding = 1466px minimum). Between the tablet
        // breakpoint and that point, clamping active-w to whatever's
        // actually left keeps both the image and the info panel fitting
        // on screen instead of overflowing — the image/info split stays
        // the same ~57.6/42.4 ratio as the fixed 600/442px values, just
        // scaled. Above 1466px this reproduces the old fixed numbers
        // exactly, so nothing changes for anyone already comfortable.
        // nav-w itself is 360 (not the tighter 320 used elsewhere) so the
        // longest real label — Spanish's "Largometraje de Media Noche" —
        // fits without the ellipsis clipping it at 320.
        const navW = 360;
        const rightPad = 64; // matches .film-area's fixed padding-right
        const available = window.innerWidth - navW - rightPad;
        const activeW = Math.min(1042, Math.max(700, available));
        const activeImgW = Math.round(activeW * (600 / 1042));
        LOAD_BOX_W = 363;
        LOAD_BOX_H = 204.1875;
        ACTIVE_H = 337.5;
        COMPACT_H = 204.1875;
        TILE_GAP = 20;
        root.setProperty('--nav-w', navW + 'px');
        root.setProperty('--tile-w', '363px');
        root.setProperty('--tile-h', '204.1875px');
        root.setProperty('--active-w', activeW + 'px');
        root.setProperty('--active-h', '337.5px');
        root.setProperty('--active-img-w', activeImgW + 'px');
      }
      root.setProperty('--tile-gap', TILE_GAP + 'px');
    }

    // Track which section is visible
    const hero = document.querySelector('.hero');
    const filmSection = document.querySelector('.film-section');
    const footerSection = document.querySelector('.footer-section');

    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.target === filmSection) {
          if (e.isIntersecting && !inFilmSection) {
            // Just entered film section — lock film navigation briefly
            // so scroll momentum from the section transition doesn't skip film 0
            sectionTransitionLock = true;
            setTimeout(() => { sectionTransitionLock = false; }, 1200);
            // The intro text now lives in the hero, so there's nothing to
            // pause on here — the same scroll that brings this section into
            // view kicks off the film stills loading in. startLoading()
            // measures each tile's on-screen position once, synchronously,
            // and bakes that into a fixed translate() offset — so if CSS
            // scroll-snap (html { scroll-snap-type }) is still gliding the
            // last pixels into place when that measurement happens (it can
            // still be moving after threshold:1.0 already reports "fully
            // visible"), whatever it glides afterward becomes baked-in
            // error, flashing the stills in too high/cropped. A fixed
            // delay here was a guess at how long that glide takes — on a
            // real desktop trackpad/mouse flick it can vary and occasionally
            // outlast a short guess. Waiting for the browser's own
            // scrollend signal (with a fixed-delay fallback for browsers
            // without it) is exact instead of guessed.
            if (phase === 'intro') {
              let started = false;
              const begin = () => {
                if (started) return;
                started = true;
                window.removeEventListener('scrollend', begin);
                if (phase === 'intro') startLoading();
              };
              if ('onscrollend' in window) {
                window.addEventListener('scrollend', begin, { once: true });
                setTimeout(begin, 900); // safety net if scrollend never fires
              } else {
                setTimeout(begin, 500);
              }
            }
          }
          inFilmSection = e.isIntersecting;
          updateAmbientNoiseForSection();
        } else if (e.target === footerSection) {
          inFooterSection = e.isIntersecting;
        }
      });
    }, { threshold: 1.0 }); // only counts as "in" once fully in view — the loading flash never starts mid-transition
    observer.observe(filmSection);
    observer.observe(footerSection);

    // Gates whether TOUCH input drives the film carousel — a much looser
    // threshold than the strict one above, which exists only to time the
    // loading flash precisely. On real mobile devices, native momentum
    // scroll bringing the film section into view rarely lands at an exact
    // 100% intersection (dynamic browser-chrome/address-bar resizing the
    // viewport, rubber-banding, etc.), so gating swipe navigation on that
    // same strict signal left touch devices stuck in "native scroll" when
    // approaching the film section from the footer — a swipe up would sail
    // straight through into the hero instead of stepping back through the
    // list film by film. Same fix pattern as heroVideoObserver below.
    // Wheel input deliberately does NOT use this — see its own listener.
    let filmSectionNavReady = false;
    const filmSectionNavObserver = new IntersectionObserver(entries => {
      entries.forEach(e => { filmSectionNavReady = e.isIntersecting; });
    }, { threshold: 0.5 });
    filmSectionNavObserver.observe(filmSection);

    // Pause the hero video once it's scrolled (mostly) out of view, resume
    // once it's back — a separate, looser-threshold observer from the one
    // above, since requiring exact full visibility here occasionally never
    // fires true at all (sub-pixel viewport rounding at the very top of the
    // page) and leaves the video stuck paused from the start.
    const heroVideoObserver = new IntersectionObserver(entries => {
      entries.forEach(e => {
        const heroVideo = document.getElementById('heroVideo');
        if (!heroVideo) return;
        if (e.isIntersecting) heroVideo.play(); else heroVideo.pause();
        // The unmute button only controls this video, so only show it
        // while the hero itself is in view — otherwise it sits fixed
        // over the film list/footer controlling a video the visitor
        // can't even see anymore.
        const unmuteBtn = document.getElementById('unmuteBtn');
        if (unmuteBtn) unmuteBtn.hidden = !e.isIntersecting;
      });
    }, { threshold: 0.1 });
    heroVideoObserver.observe(hero);

    // Builds the DOM for the current `films` array (bg layers, nav labels,
    // tiles) from scratch. Called once at startup and again any time `films`
    // is rebuilt for a different region (see applyRegion()) — region and
    // language are orthogonal, so this always renders in English; if a
    // non-EN language is active, the caller re-applies it right after.
    function renderFilms() {
      const bgLayers = document.getElementById('bgLayers');
      const timeNav  = document.getElementById('timeNav');
      const filmArea = document.getElementById('filmArea');

      Array.from(bgLayers.querySelectorAll('.film-bg-layer')).forEach(el => el.remove());
      timeNav.innerHTML = '';
      filmArea.innerHTML = '';

      films.forEach((film, i) => {
        const layer = document.createElement('div');
        layer.className = 'bg-layer film-bg-layer';
        layer.style.background = film.sky;
        bgLayers.appendChild(layer);

        const label = document.createElement('div');
        label.className = 'time-label';
        label.textContent = film.timeLabel; // the slot's time-of-day name (Opening Feature, ...), not the film title
        label.addEventListener('click', () => {
          if (phase !== 'list' || i === activeIndex) return;
          playBlip(i > activeIndex ? 'down' : 'up');
          setActive(i);
        });
        timeNav.appendChild(label);

        const tile = document.createElement('div');
        tile.className = 'film-tile';
        tile.addEventListener('click', () => {
          if (phase !== 'list') return;
          if (i === activeIndex) {
            window.location.href = film.url;
          } else {
            playBlip(i > activeIndex ? 'down' : 'up');
            setActive(i);
          }
        });
        // MUBI's own still_focal_point (0-1 fractions of width/height) —
        // keeps the shot's actual subject centered when object-fit:cover
        // crops the image, instead of always cropping around the
        // geometric middle. Falls back to dead-center for any film
        // missing one.
        const focal = film.focalPoint || { x: 0.5, y: 0.5 };
        const objectPosition = `${(focal.x * 100).toFixed(2)}% ${(focal.y * 100).toFixed(2)}%`;
        tile.innerHTML = `
          <div class="tile-image">
            <img src="${film.still}" alt="${film.title}" referrerpolicy="no-referrer" style="object-position: ${objectPosition};">
            <svg class="tile-play-icon" viewBox="0 0 44 44" fill="none">
              <circle cx="21" cy="21" r="21" fill="none" stroke="#FFFFFF" stroke-width="1"/>
              <path d="M30 21.5L15 29V14z" fill="#FFFFFF"/>
            </svg>
          </div>
          <div class="film-info">
            <div class="film-info-top">
              <div class="film-slot-label">${film.timeLabel}</div>
              <h2 class="film-title">${film.title}</h2>
              <div class="film-meta">${film.director}, ${film.year}</div>
            </div>
            <div class="film-info-bottom">
              <p class="film-synopsis">${film.synopsis}</p>
            </div>
          </div>
        `;
        filmArea.appendChild(tile);
      });
    }

    function init() {
      renderFilms();
      enterIntro();
    }

    // ── Carousel layout: one fixed "active" slot, upcoming tiles queued below it ──
    // ACTIVE_Y is kept in sync with the loader's stills' top edge (see
    // syncColumnCenter()), so the settled list starts exactly where the
    // loading animation happened, top-aligned with it.
    let ACTIVE_Y = 80;
    let ACTIVE_H = 337.5, COMPACT_H = 204.1875, TILE_GAP = 20;
    const NAV_ROW_H = 19; // nav is hidden on mobile, so this stays fixed
    // True once the active tile is actually at its full (expanded) height.
    // While the loader's uniform list is briefly pinned at compact size (see
    // finishLoading()), this is false, so the row below is spaced assuming
    // the active slot's *current* (compact) height — keeping the gap a true
    // 20px in both phases instead of leaving room for a size it hasn't
    // grown into yet.
    let activeExpanded = true;

    function tileTop(d) {
      const activeSlotH = activeExpanded ? ACTIVE_H : COMPACT_H;
      if (d === 0) return ACTIVE_Y;
      if (d > 0)  return ACTIVE_Y + activeSlotH + TILE_GAP + (d - 1) * (COMPACT_H + TILE_GAP);
      return ACTIVE_Y - (-d) * (COMPACT_H + TILE_GAP);
    }

    // Positions every tile relative to activeIndex: the active tile always
    // lands at the same fixed top (ACTIVE_Y); tiles ahead queue below it at
    // compact size; tiles already passed scroll up and out of view.
    function layoutTiles() {
      document.querySelectorAll('.film-tile').forEach((t, i) => {
        const d = i - activeIndex;
        t.classList.toggle('active', d === 0);
        t.classList.toggle('passed', d < 0);
        t.style.top = tileTop(d) + 'px';
      });
    }

    // Positions every nav label relative to activeIndex, so the active title
    // always sits on the same horizontal line as the active image (a
    // "crosshair"), and the rest scroll through it above/below. Pass
    // instant=true to snap straight to position with no transition (used for
    // the first-ever layout, so the nav just fades in where it belongs
    // instead of flying in from wherever it defaulted to) — later calls
    // (regular scrolling) keep the normal animated move.
    function layoutNav(instant) {
      const labels = document.querySelectorAll('.time-label');
      const crosshairY = ACTIVE_Y + ACTIVE_H / 2 - NAV_ROW_H / 2;
      if (instant) labels.forEach(el => { el.style.transition = 'none'; });
      labels.forEach((el, i) => {
        const d = i - activeIndex;
        el.classList.toggle('active', d === 0);
        el.style.top = (crosshairY + d * NAV_ROW_H) + 'px';
      });
      if (instant) {
        void document.getElementById('timeNav').offsetHeight; // flush before re-enabling
        requestAnimationFrame(() => requestAnimationFrame(() => {
          labels.forEach(el => { el.style.transition = ''; });
        }));
      }
    }

    function setActive(index, instant) {
      if (index === activeIndex) return;
      activeIndex = index;
      document.getElementById('introBg').classList.remove('active');
      document.querySelectorAll('.film-bg-layer').forEach((el, i)  => el.classList.toggle('active', i === index));
      layoutTiles();
      layoutNav(instant);
      // Down-arrow hint only shows on the last film — a "there's more
      // below" cue toward the footer, not needed on every film.
      document.getElementById('filmKeyHint').classList.toggle('visible', index === films.length - 1);
    }

    // ── Intro → loading → list sequence ──

    function enterIntro() {
      phase = 'intro';
      activeIndex = -1;
      filmSection.classList.remove('stills-loading', 'stills-settling');
      document.getElementById('timeNav').classList.add('hidden');
      document.getElementById('introBg').classList.add('active');
      document.querySelectorAll('.film-bg-layer').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.time-label').forEach(el => el.classList.remove('active'));
      // Back to its CSS default (visible), so it's already on screen when
      // the section scrolls into view again.
      const logo = document.getElementById('flashLogo');
      logo.style.transition = 'none';
      logo.style.opacity = '';
      document.querySelectorAll('.film-tile').forEach(t => {
        t.classList.remove('active');
        t.removeAttribute('style');
        t.style.opacity = '0';
      });
    }

    // Scrolling past the intro: hide the text, zoom the film stills in one by
    // one stacked on top of each other, then spread them into the list.
    // Desktop (v2): the stack fills the whole screen instead of the small
    // compact box, so each reveal flashes a full-bleed still on top of the
    // last before finishLoading() flies the pile down into the actual list.
    // Mobile keeps the original compact-box behavior — there's no spare
    // screen real estate for a full-bleed detour there.
    function startLoading() {
      if (phase !== 'intro') return;
      phase = 'loading';
      filmSection.classList.add('stills-loading');
      startLoadingStack();
    }

    function startLoadingStack() {
      // Lock in columnLeftX/ACTIVE_Y right now, synchronously, rather than
      // trusting the double-rAF sync from page load to have already resolved
      // (it may not have, on a fast scroll) or to still be current (a resize
      // could've happened since). The stack's anchor point below and the
      // list's rest position (ACTIVE_Y, used once this flies out to its
      // resting spot) are then the exact same values on mobile — the flash
      // starts exactly where the settled active tile ends up, no seam
      // between them. Desktop's stack point is the viewport itself instead.
      syncColumnCenter();

      const tiles = Array.from(document.querySelectorAll('.film-tile'));
      const fullScreen = !isMobile();
      // Compact box on mobile (unchanged); full viewport on desktop. Either
      // way every still, including the one that will become active (tiles[0],
      // loaded in last — see the reveal order below), loads in at the same
      // size — nothing needs to move to settle into the list; the active one
      // resizes afterward, as its own separate step.
      const boxW = fullScreen ? window.innerWidth : LOAD_BOX_W;
      const boxH = fullScreen ? window.innerHeight : LOAD_BOX_H;

      tiles.forEach((t) => {
        t.style.transition = 'none';
        t.style.willChange = fullScreen ? 'transform, width, height' : ''; // cleared in finishLoading()'s cleanup
        t.style.transformOrigin = 'center center'; // scale up from the middle of the spot it's pinned to, not a corner
        t.style.width = boxW + 'px';
        t.style.height = boxH + 'px';
        t.style.opacity = '0';
        t.style.clipPath = 'inset(50% 50% 50% 50%)';
        if (fullScreen) {
          // .tile-image's own width is normally driven by --tile-w/
          // --active-img-w (a few hundred px) — force it to fill this much
          // bigger full-screen frame instead, just for the flash. It has
          // its own separate `transition: width 0.8s` in its base CSS
          // rule (for the compact/active size change elsewhere), which
          // must be turned off here too — same as .film-tile above —
          // or this resize itself tries to animate instead of snapping.
          // Cleared in finishLoading() once the FLIP "before" rect is
          // captured.
          const img = t.querySelector('.tile-image');
          img.style.transition = 'none';
          img.style.width = boxW + 'px';
        }
      });
      void tiles[0].offsetHeight; // flush the size change before measuring

      const deltas = tiles.map(t => {
        const r = t.getBoundingClientRect();
        const targetLeft = fullScreen ? 0 : (columnLeftX != null ? columnLeftX : r.left);
        const targetTop = fullScreen ? 0 : ACTIVE_Y;
        return { dx: targetLeft - r.left, dy: targetTop - r.top };
      });
      tiles.forEach((t, i) => { t.style.transform = `translate(${deltas[i].dx}px, ${deltas[i].dy}px) scale(0.4)`; });
      void tiles[0].offsetHeight; // flush the transform before enabling transitions

      // Reveal in reverse order — the first film (index 0) loads in last, so it
      // ends up on top of the stack and the downward spread into the list,
      // starting right where it already is, reads smoother.
      const order = tiles.map((t, i) => ({ t, d: deltas[i] })).reverse();
      order.forEach((entry, pos) => { entry.t.style.zIndex = String(pos + 1); });

      // The reveals themselves come in fast, then ease off slightly toward
      // the end (quadratic ease-in on the gap between them) — a subtle
      // acceleration-then-settle to the stagger's rhythm, rather than a flat
      // metronome interval.
      let i = 0;
      function revealNext() {
        if (i >= order.length) {
          // Hold on the last still before it shrinks into the list — longer
          // on desktop, where it's a full-screen image worth a beat.
          setTimeout(finishLoading, fullScreen ? 1100 : 550);
          return;
        }
        const { t, d } = order[i];
        const dur = '0.6s';
        const ease = 'cubic-bezier(0.22, 0.61, 0.36, 1)';
        t.style.transition = `opacity ${dur} ${ease}, clip-path ${dur} ${ease}, transform ${dur} ${ease}`;
        t.style.opacity = '1';
        t.style.clipPath = 'inset(0% 0% 0% 0%)';
        t.style.transform = `translate(${d.dx}px, ${d.dy}px) scale(1)`;
        i++;
        const u = order.length > 1 ? i / (order.length - 1) : 0;
        const gap = Math.round(170 + 110 * u * u); // 170ms early on, up to 280ms by the end
        setTimeout(revealNext, gap);
      }
      requestAnimationFrame(() => requestAnimationFrame(revealNext));
    }

    // FLIP: fly every stacked/centered tile out to its carousel resting position
    // (the active tile big at the top, the rest queued below at compact size).
    function finishLoading() {
      const tiles = Array.from(document.querySelectorAll('.film-tile'));
      const firstRects = tiles.map(t => t.getBoundingClientRect());
      const fullScreen = !isMobile();

      // The logo stays up through the hold after the last still flashes
      // in, and only fades as the stills start dropping into the list.
      const logo = document.getElementById('flashLogo');
      logo.style.transition = 'opacity 0.6s ease';
      logo.style.opacity = '0';

      tiles.forEach((t, i) => {
        t.style.transition = 'none';
        t.style.transformOrigin = ''; // back to the carousel's top-left anchor
        t.style.width = '';
        t.style.height = '';
        t.style.clipPath = '';
        t.style.transform = 'none';
        // Release the full-screen image width forced during the flash
        // (see startLoadingStack()) — transition stays disabled for now
        // (re-enabled below) so this doesn't itself animate; .tile-image
        // just snaps straight to whatever size its current class (active
        // or not) calls for, and rides along with the outer FLIP scale
        // below rather than animating its width separately.
        const img = t.querySelector('.tile-image');
        img.style.transition = 'none';
        img.style.width = '';
        // Re-stack to match the list's visual order (tile 0 on top, last tile
        // at the bottom) instead of clearing z-index, which would fall back
        // to DOM order (last tile on top) and flip the stacking the instant
        // the flight starts.
        t.style.zIndex = String(tiles.length - i);
        t.style.opacity = '';
      });
      phase = 'list';
      const activeTile = tiles[0];
      const activeImg = activeTile.querySelector('.tile-image');

      if (fullScreen) {
        // v2 desktop: the active tile flashed in at full-screen size, so
        // it flies straight from there to its true final (expanded) size
        // and position in this one flight — no separate "settle small,
        // then grow" second beat, which read as an unwanted shrink then
        // grow-again. Row 1's gap is therefore already spaced for the
        // active tile's full height from the start (activeExpanded=true),
        // not a placeholder compact-height gap.
        activeExpanded = true;
        setActive(0, true); // applies bg-layer/nav + lays every tile out at its true resting top/size
      } else {
        // Mobile: unchanged from before — the active tile is pinned back
        // to its loaded-in compact size for this flight, and only grows
        // into its full size afterward (see the trailing setTimeout),
        // once the list itself has settled. Row 1's gap matches that
        // compact placeholder height for now.
        activeExpanded = false;
        setActive(0, true);
        activeTile.style.width = LOAD_BOX_W + 'px';
        activeTile.style.height = LOAD_BOX_H + 'px';
        activeImg.style.width = LOAD_BOX_W + 'px';
      }
      void tiles[0].offsetHeight;

      const lastRects = tiles.map(t => t.getBoundingClientRect());
      let settleMs = 950;
      if (fullScreen) {
        // v2 desktop: animate the real width/height (and the image's
        // width) from the full-screen size the last still flashed in at,
        // rather than a scale() FLIP. A scale would stretch the active
        // tile's image+info layout to fill the screen, so on the first
        // frame the image would jump to the left ~58% of the screen and
        // distort; resizing instead keeps the first frame identical to the
        // last flashed still (object-fit:cover just re-crops as it shrinks).
        //
        // Two beats: first tile 0 shrinks from full screen to its final
        // active size and spot. The rest are invisible for this part, so
        // they skip straight to their compact size, bottom-left aligned
        // with tile 0's final spot (tucked under it) — no point animating
        // their size, and it keeps the per-frame layout work to the one
        // tile that's actually on screen, which is what makes the shrink
        // smooth. Only once tile 0 is in place do the rest appear and all
        // drop down together into their queued spots.
        //
        // Ease-in-out weighted toward a long, soft landing: eases gently off
        // the full-screen still, then glides into place rather than
        // arriving at speed.
        const dur = 1.3;
        const ease = 'cubic-bezier(0.45, 0, 0.15, 1)';
        const DROP_DUR = 0.7;
        const DROP_DELAY = 0.6; // pause with tile 0 settled before the rest drop
        const dropEase = 'cubic-bezier(0.22, 0.61, 0.36, 1)';
        const slotBottom = lastRects[0].bottom;
        tiles.forEach((t, i) => {
          if (i === 0) return;
          t.style.opacity = '0';
          t.style.transform = `translate(0px, ${slotBottom - lastRects[i].bottom}px)`;
        });
        const f0 = firstRects[0], l0 = lastRects[0];
        const img0 = activeTile.querySelector('.tile-image');
        activeTile.style.width = f0.width + 'px';
        activeTile.style.height = f0.height + 'px';
        img0.style.width = f0.width + 'px';
        activeTile.style.transform = `translate(${f0.left - l0.left}px, ${f0.top - l0.top}px)`;
        void activeTile.offsetHeight;
        activeTile.style.transition = `transform ${dur}s ${ease}, width ${dur}s ${ease}, height ${dur}s ${ease}`;
        img0.style.transition = `width ${dur}s ${ease}`;
        activeTile.style.width = '';
        activeTile.style.height = '';
        img0.style.width = '';
        activeTile.style.transform = 'none';
        setTimeout(() => {
          tiles.forEach((t, i) => {
            if (i === 0) return;
            t.style.transition = `transform ${DROP_DUR}s ${dropEase}`;
            t.style.opacity = ''; // back to visible the instant the drop starts
            t.style.transform = 'none';
          });
        }, (dur + DROP_DELAY) * 1000);
        settleMs = (dur + DROP_DELAY + DROP_DUR) * 1000 + 50;
        // Still mid-animation until the drop's done — keep input/resize
        // treating this as loading so a scroll can't re-layout the tiles
        // under their inline transforms.
        phase = 'loading';
      } else {
        tiles.forEach((t, i) => {
          const f = firstRects[i], l = lastRects[i];
          // Anchored at top-left (matching .film-tile's transform-origin), so a
          // tile whose left edge never moves (all of them) gets zero horizontal
          // drift — it just travels vertically and grows/shrinks from that corner,
          // instead of appearing to fly in sideways.
          const dx = f.left - l.left;
          const dy = f.top - l.top;
          const sx = l.width  ? f.width  / l.width  : 1;
          const sy = l.height ? f.height / l.height : 1;
          t.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
        });
        void tiles[0].offsetHeight;

        tiles.forEach(t => {
          // Starts slow, then accelerates hard through the rest of the flight
          // (a mild cushion right at the very end so it doesn't hard-stop).
          t.style.transition = 'transform 0.9s cubic-bezier(0.55, 0, 0.85, 0.4)';
          t.style.transform = 'none';
        });
      }

      setTimeout(() => {
        if (phase === 'loading') phase = 'list'; // desktop held it at 'loading' through the drop (not if the visitor already left for the intro)
        tiles.forEach(t => {
          t.style.transition = '';
          t.style.transform = '';
          t.style.willChange = '';
          t.querySelector('.tile-image').style.transition = ''; // back to its normal CSS-driven transition for later navigation
        });
        // The loader has now actually transitioned into a list — only now
        // does the nav fade in, not while the stack was still flying apart.
        document.getElementById('timeNav').classList.remove('hidden');
        if (!fullScreen) {
          // Mobile only: the list is fully settled, all tiles at the same
          // size — release the pin immediately so the top tile starts
          // growing into the active one right away. The row below animates
          // down in the same instant, keeping a consistent 20px gap as the
          // active tile expands rather than a gap that was already sized
          // for it.
          activeTile.style.width = '';
          activeTile.style.height = '';
          activeImg.style.width = '';
          activeExpanded = true;
          layoutTiles();
        }
        // Loading done — CRT flicker/static and the play icon back on, but
        // only once the active image has fully settled into the list: right
        // away on desktop (it arrived at its final size with the flight),
        // after its 0.8s grow on mobile.
        //
        // The play icon comes back then; on desktop the image flicker waits
        // a beat longer (stills-settling) so it doesn't start the instant
        // the list lands.
        setTimeout(() => {
          if (phase !== 'list') return;
          filmSection.classList.remove('stills-loading');
          if (!fullScreen) return;
          filmSection.classList.add('stills-settling');
          setTimeout(() => filmSection.classList.remove('stills-settling'), 2000);
        }, fullScreen ? 0 : 850);
      }, settleMs);
    }

    // Debug menu: language selector
    document.getElementById('langSelect').addEventListener('change', e => applyLanguage(e.target.value));

    // Debug menu: region selector
    document.getElementById('regionSelect').addEventListener('change', e => applyRegion(e.target.value));

    // Unmute toggle — icon swap (speaker-muted / speaker-unmuted) instead
    // of a text label. The icons are inline <svg> (SVGElement, not
    // HTMLElement) — the .hidden IDL property doesn't reflect onto the
    // actual hidden attribute for those, so toggling .hidden here was a
    // silent no-op. toggleAttribute works on any element.
    function wireUnmuteButton(videoEl, btnEl) {
      const mutedIcon = btnEl.querySelector('.icon-muted');
      const unmutedIcon = btnEl.querySelector('.icon-unmuted');
      btnEl.addEventListener('click', () => {
        videoEl.muted = !videoEl.muted;
        mutedIcon.toggleAttribute('hidden', !videoEl.muted);
        unmutedIcon.toggleAttribute('hidden', videoEl.muted);
        btnEl.setAttribute('aria-label', videoEl.muted ? 'Unmute' : 'Mute');
      });
    }
    const video = document.getElementById('heroVideo');
    const btn   = document.getElementById('unmuteBtn');
    wireUnmuteButton(video, btn);

    // Wraps scrollIntoView for every JS-triggered section jump (the MUBI
    // logo, "press play", keyboard nav below). Mobile Safari (and some
    // mobile Chrome) has a known interaction where CSS scroll-snap
    // (html { scroll-snap-type }) can silently swallow a programmatic
    // scroll fired right after a native swipe just settled the page into
    // a snap position — it looks like the tap did nothing, and often only
    // starts working on a later attempt once whatever internal snap state
    // has cleared. Toggling snap off for the duration of this one scroll,
    // then restoring it once scrollend fires (or a fallback timeout),
    // sidesteps it without affecting native swipe/wheel scrolling, which
    // never calls this.
    function smoothScrollToSection(el) {
      const html = document.documentElement;
      html.style.scrollSnapType = 'none';
      el.scrollIntoView({ behavior: 'smooth' });
      let restored = false;
      const restore = () => {
        if (restored) return;
        restored = true;
        window.removeEventListener('scrollend', restore);
        html.style.scrollSnapType = '';
      };
      if ('onscrollend' in window) {
        window.addEventListener('scrollend', restore, { once: true });
        setTimeout(restore, 1000);
      } else {
        setTimeout(restore, 700);
      }
    }

    // MUBI logo in the film section header — scrolls back to the top of
    // the page instead of leaving to mubi.com.
    document.getElementById('mubiLogoLink').addEventListener('click', () => {
      smoothScrollToSection(hero);
    });

    // Footer's "Press play to start watching" — jumps back to the first
    // film rather than wherever the carousel was left. The scroll alone
    // re-triggers the same observer that starts the loading flash when
    // entering the section fresh (phase 'intro'); the explicit setActive(0)
    // covers the case where the visitor already scrolled through some
    // films earlier (phase 'list', activeIndex > 0).
    document.querySelector('.footer-section .hero-headline').addEventListener('click', () => {
      if (phase === 'list' && activeIndex !== 0) setActive(0);
      smoothScrollToSection(filmSection);
    });

    // Globe icon → language/region panel: click the globe to open (it
    // hides itself while the panel's open so the two don't overlap in the
    // same corner), the X or Escape or an outside click to close.
    const globeBtn = document.getElementById('globeBtn');
    const langRegionPanel = document.getElementById('langRegionPanel');
    const panelCloseBtn = document.getElementById('panelCloseBtn');

    function openLangRegionPanel() {
      langRegionPanel.hidden = false;
      globeBtn.hidden = true;
    }
    function closeLangRegionPanel() {
      langRegionPanel.hidden = true;
      globeBtn.hidden = false;
    }
    globeBtn.addEventListener('click', openLangRegionPanel);
    panelCloseBtn.addEventListener('click', closeLangRegionPanel);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !langRegionPanel.hidden) closeLangRegionPanel();
    });
    document.addEventListener('pointerdown', e => {
      if (!langRegionPanel.hidden && !langRegionPanel.contains(e.target)) closeLangRegionPanel();
    });

    // Keyboard navigation — ↑ ↓ drive the whole page top to bottom: hero →
    // film list → footer, and back up again, the same three stops the wheel/
    // touch handlers snap between.
    document.addEventListener('keydown', e => {
      const isDown = e.key === 'ArrowDown' || e.key === 'ArrowRight';
      const isUp   = e.key === 'ArrowUp'   || e.key === 'ArrowLeft';
      if (!isDown && !isUp) return;
      if (phase === 'loading') { e.preventDefault(); return; }
      // Holding a key down auto-repeats — one press, one step.
      if (e.repeat) { e.preventDefault(); return; }

      // Above the film section (hero) — down enters it; up is already the top.
      if (!inFilmSection && !inFooterSection) {
        if (isDown) { e.preventDefault(); smoothScrollToSection(filmSection); }
        return;
      }

      // Below the film section (footer) — up returns to the list; down is already the bottom.
      if (inFooterSection) {
        if (isUp) { e.preventDefault(); smoothScrollToSection(filmSection); }
        return;
      }

      // Inside the film section
      e.preventDefault();
      if (phase === 'intro') {
        if (isDown) startLoading();
        else smoothScrollToSection(hero); // up, back to the hero
        return;
      }

      // phase === 'list'
      if (isDown) {
        if (activeIndex === films.length - 1) {
          if (scrollLocked) return; // still animating onto the last film
          smoothScrollToSection(footerSection); // last film, down into the footer
        } else {
          stepFilm(1);
        }
      } else if (isUp) {
        if (activeIndex === 0) { if (!scrollLocked) smoothScrollToSection(hero); return; }
        stepFilm(-1);
      }
    });

    // Scroll navigation — shared by wheel (desktop trackpad/mouse) and touch
    // (mobile swipe) input. deltaY follows wheel convention: positive means
    // "scroll down" / advance, negative means "scroll up" / go back.
    // Returns true if the intent was handled (caller should suppress the
    // browser's own scroll for this event), or false to let it through
    // (releasing to native scroll, e.g. into the hero or footer sections).
    let scrollLocked = false;
    function wouldReleaseToNativeScroll(deltaY) {
      if (phase === 'intro') return deltaY < 0;
      // At either end of the list, release to native scroll instead of
      // resetting anything — film 0 stays exactly as loaded (no replay of
      // the loading flash) if the visitor scrolls back down again.
      if (phase === 'list') return (activeIndex === films.length - 1 && deltaY > 0) || (activeIndex === 0 && deltaY < 0);
      return false; // 'loading' never releases — it's an uninterruptible animation
    }
    function handleScrollIntent(deltaY) {
      if (phase === 'loading') return true;

      if (phase === 'intro') {
        if (deltaY < 0) return false; // scrolling up → release to native scroll, back to hero
        startLoading();
        return true;
      }

      // phase === 'list'
      // At last film scrolling down → release to native scroll, into the footer section
      if (activeIndex === films.length - 1 && deltaY > 0) return false;
      // At first film scrolling up → release to native scroll, back to the
      // hero — the list underneath is left exactly as it is, not torn down.
      if (activeIndex === 0 && deltaY < 0) return false;

      stepFilm(deltaY > 0 ? 1 : -1);
      return true;
    }

    // One film forward/back. No input moves the list again until the
    // tile animation (0.8s) has finished — wheel, swipe and keys alike.
    // Returns whether it actually stepped.
    function stepFilm(dir) {
      if (scrollLocked) return false;
      const next = Math.max(0, Math.min(films.length - 1, activeIndex + dir));
      if (next === activeIndex) return false;
      scrollLocked = true;
      setActive(next);
      playBlip(dir > 0 ? 'down' : 'up');
      setTimeout(() => { scrollLocked = false; }, 900);
      return true;
    }

    // Wheel gates on the strict inFilmSection (not the looser
    // filmSectionNavReady below), unlike touch. A continuous trackpad/
    // mouse-wheel gesture fires many wheel events over its course — gating
    // on the loose 0.5 threshold let the LATER events in a single scroll
    // gesture (once the section crossed 50% visible) get hijacked and
    // preventDefault()'d as carousel navigation, truncating the native
    // scroll/CSS-snap before it ever reached full alignment and stranding
    // the page mid-transition — the film section (and the loading flash
    // that starts once "fully visible" fires) ends up cropped at the top.
    // Touch doesn't have this failure mode (a whole swipe is one gesture,
    // decided once at touchstart), so it still needs the loose threshold
    // for the reason noted below.
    //
    // One step per wheel gesture: a trackpad/Magic Mouse flick keeps
    // firing momentum events for 1-2s after the fingers lift, far longer
    // than the step lock, so the tail of one flick used to fire a second
    // step (skipping a film) — or, landing on the last/first film, carry
    // straight on out into the footer/hero. Now once a gesture has moved
    // the list, the rest of it is eaten; a new gesture only counts after
    // the wheel has gone quiet for WHEEL_QUIET_MS.
    const WHEEL_QUIET_MS = 200;
    let lastWheelAt = 0;
    let wheelGestureSpent = false;
    document.addEventListener('wheel', e => {
      const now = performance.now();
      if (now - lastWheelAt > WHEEL_QUIET_MS) wheelGestureSpent = false; // a fresh gesture
      lastWheelAt = now;
      if (!inFilmSection) return;
      // During section transition, eat all wheel events to prevent momentum bleed
      if (sectionTransitionLock) { e.preventDefault(); wheelGestureSpent = true; return; }
      if (wheelGestureSpent) { e.preventDefault(); return; }
      // Mid-animation: eat it, and don't let this gesture count later either.
      if (phase === 'list' && scrollLocked) { e.preventDefault(); wheelGestureSpent = true; return; }
      // Sideways-only trackpad swipes report deltaY 0 — that isn't an
      // up/down intent (it used to read as "up" and step back a film).
      if (Math.abs(e.deltaY) < 1) return;
      const before = activeIndex, phaseBefore = phase;
      if (handleScrollIntent(e.deltaY)) {
        e.preventDefault();
        if (activeIndex !== before || phase !== phaseBefore) wheelGestureSpent = true;
      }
    }, { passive: false });

    // Touch (mobile) — swipes drive the exact same state machine as the wheel
    // handler above. touchmove suppresses the page's own scroll while we're
    // "inside" the hijacked section (mirroring wheel's preventDefault), and
    // the actual film-to-film move fires once on touchend, based on total
    // swipe distance, so small jitters/taps don't trigger a navigation.
    let touchStartY = null;
    let touchTracking = false;
    const SWIPE_THRESHOLD = 40;
    document.addEventListener('touchstart', e => {
      touchTracking = filmSectionNavReady;
      touchStartY = touchTracking ? e.touches[0].clientY : null;
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (!touchTracking) return;
      if (sectionTransitionLock) { e.preventDefault(); return; }
      if (phase === 'list' && scrollLocked) { e.preventDefault(); return; } // no swiping out of the section mid-animation
      const deltaY = touchStartY - e.touches[0].clientY; // positive = finger moved up = scroll-down intent
      if (!wouldReleaseToNativeScroll(deltaY)) e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchend', e => {
      if (!touchTracking) return;
      touchTracking = false;
      if (sectionTransitionLock) return;
      const deltaY = touchStartY - e.changedTouches[0].clientY;
      touchStartY = null;
      if (Math.abs(deltaY) < SWIPE_THRESHOLD) return; // a tap, or too small to count as a swipe
      if (phase === 'list' && scrollLocked) return; // still animating the last step
      handleScrollIntent(deltaY);
    }, { passive: true });

    // Establishes where the carousel's active slot lives: columnLeftX (the
    // shared left edge every tile zooms in along) and ACTIVE_Y (the fixed
    // vertical position the active tile always sits at, both during the
    // loading stack-and-spread animation and once settled into the list).
    function syncColumnCenter() {
      const firstTile = document.querySelector('.film-tile');
      if (!firstTile) return;
      const r = firstTile.getBoundingClientRect();
      columnLeftX = r.left;
      // On mobile the active still is much taller than the viewport, so
      // centering it would push its bottom (and the overlaid info) off
      // screen — pin it near the top instead, clear of the header, so the
      // whole opened tile reads top-to-bottom as you scroll to it.
      ACTIVE_Y = isMobile() ? 90 : (centerY() - LOAD_BOX_H / 2);
      positionFlashLogo();
      if (phase === 'list') { layoutTiles(); layoutNav(); }
    }

    // Desktop: the stills flash full-screen, so the logo stays at its CSS
    // default (the middle of the section). Mobile: they flash into the
    // compact box at (columnLeftX, ACTIVE_Y), so the logo sits centered
    // over that box instead, sized to fit inside it.
    function positionFlashLogo() {
      const logo = document.getElementById('flashLogo');
      if (isMobile()) {
        logo.style.left = ((columnLeftX || 0) + LOAD_BOX_W / 2) + 'px';
        logo.style.top = (ACTIVE_Y + LOAD_BOX_H / 2) + 'px';
        logo.style.maxHeight = Math.round(LOAD_BOX_H * 0.7) + 'px';
      } else {
        logo.style.left = '';
        logo.style.top = '';
        logo.style.maxHeight = '';
      }
    }

    // TV-static audio on the film list — a constant, faint hum rather
    // than discrete bursts, with random brief silent gaps dropped into it
    // (like a weak signal cutting in and out), plus a short blip whenever
    // the visitor navigates to the next/previous film (see playBlip,
    // called from the wheel/touch/keyboard handlers below). Generated on
    // the fly with the Web Audio API rather than sound files. Browsers
    // block audio before a user gesture, so the AudioContext — and the
    // looping noise source, which only needs to be built once — starts
    // lazily on the page's first click/tap/keypress.
    let audioCtx = null;
    let noiseGain = null;
    const NOISE_VOLUME = 0.02; // faint — a constant hum, not a burst

    // Runs on every gesture, not just the first: Safari (and Chrome after
    // the tab's been in the background a while) can leave the context
    // suspended, and iOS puts it into an 'interrupted' state after a call,
    // an app switch or another media element taking the audio session (the
    // hero video's own sound starting/stopping), so any later tap/keypress
    // wakes it back up.
    //
    // On touch screens, touchstart/pointerdown do NOT count as the user
    // gesture browsers require before audio can start — only a completed
    // tap does (touchend / pointerup / click). Listening only to the
    // "down" events meant a context created on a touch came up suspended
    // and silent, depending on exactly how the visitor had touched the page.
    function resumeAudio() {
      if (audioCtx && audioCtx.state !== 'running' && audioCtx.state !== 'closed') {
        audioCtx.resume().catch(() => {});
      }
    }
    function unlockAudio() {
      if (audioCtx) { resumeAudio(); return; }
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      startAmbientNoise();
      resumeAudio(); // some mobile browsers still start it suspended, even inside the gesture
    }
    ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(evt =>
      document.addEventListener(evt, unlockAudio, { passive: true })
    );
    // Coming back to the tab/app: iOS leaves the context interrupted, and
    // resuming from an interruption doesn't need a fresh gesture.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) resumeAudio();
    });

    function startAmbientNoise() {
      const sampleRate = audioCtx.sampleRate;
      const durationSec = 3; // short buffer, looped — a few seconds is plenty for noise
      const frameCount = Math.floor(sampleRate * durationSec);
      const buffer = audioCtx.createBuffer(1, frameCount, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < frameCount; i++) data[i] = Math.random() * 2 - 1;

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 2500;
      filter.Q.value = 0.6;

      noiseGain = audioCtx.createGain();
      noiseGain.gain.value = inFilmSection ? NOISE_VOLUME : 0;

      source.connect(filter).connect(noiseGain).connect(audioCtx.destination);
      source.start();
    }

    // Random electrical glitches, like the power to the set browning out
    // for a moment (sound + screen dimming) — every 4-14s, only while the film list
    // is in view (and the tab is visible). Checked at fire time rather
    // than paused/resumed with the section, so the loop just keeps
    // ticking quietly in the background.
    function schedulePowerGlitch() {
      setTimeout(() => {
        // Only once the list is built — never over the loading animation.
        const listReady = phase === 'list' && !filmSection.classList.contains('stills-loading');
        if (inFilmSection && listReady && !document.hidden) playPowerGlitch();
        schedulePowerGlitch();
      }, 4000 + Math.random() * 10000);
    }

    // The screen side of a glitch: the section dims hard in each gap
    // where the buzz cuts out (power gone) and only slightly while it's
    // buzzing (power sagging), then comes straight back. Skipped for
    // visitors who've asked for reduced motion.
    function flickerPowerGlitch(segments, total) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const overlay = document.getElementById('powerGlitchOverlay');
      const frames = [{ opacity: 0, offset: 0 }];
      const at = sec => Math.min(1, sec / total);
      segments.forEach(({ start, on, off }) => {
        const sag = 0.08 + Math.random() * 0.1;
        const cut = 0.35 + Math.random() * 0.25;
        frames.push({ opacity: sag, offset: at(start) });
        frames.push({ opacity: sag, offset: at(start + on) });
        frames.push({ opacity: cut, offset: at(start + on + 0.004) });
        frames.push({ opacity: cut, offset: at(start + on + off - 0.002) }); // hold the cut for the whole gap
      });
      frames.push({ opacity: 0, offset: 1 });
      // Offsets must never decrease — clamp any float/rounding overlap.
      for (let i = 1; i < frames.length; i++) {
        frames[i].offset = Math.max(frames[i].offset, frames[i - 1].offset);
      }
      overlay.animate(frames, { duration: total * 1000, easing: 'linear' });
    }

    // One glitch, 0.15-0.65s long, three layers at once: a crackle of
    // sparse decaying pops (arcing), a stuttering mains buzz gated on/off
    // at irregular intervals, and the ambient hiss sagging then recovering
    // (the supply dipping under load).
    function playPowerGlitch() {
      const dur = 0.15 + Math.random() * 0.5;
      // Stutter pattern (seconds from the start), shared by the buzz
      // gating and the screen dimming so they cut out together.
      const segments = [];
      let t = 0;
      while (t < dur) {
        const on = 0.02 + Math.random() * 0.06;
        const off = 0.01 + Math.random() * 0.05;
        segments.push({ start: t, on, off, level: 0.06 + Math.random() * 0.05 });
        t += on + off;
      }
      const total = t;
      flickerPowerGlitch(segments, total);
      if (!audioCtx) return; // no sound until the first gesture unlocks audio — the flicker still runs

      const now = audioCtx.currentTime;
      const sr = audioCtx.sampleRate;

      // Crackle
      const frames = Math.floor(sr * dur);
      const buf = audioCtx.createBuffer(1, frames, sr);
      const data = buf.getChannelData(0);
      let env = 0;
      for (let i = 0; i < frames; i++) {
        if (Math.random() < 0.0015) env = 0.6 + Math.random() * 0.4; // a new pop
        env *= 0.9985; // ~15ms tail per pop — long enough to actually hear
        data[i] = (Math.random() * 2 - 1) * env;
      }
      const crackle = audioCtx.createBufferSource();
      crackle.buffer = buf;
      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 800;
      const crackleGain = audioCtx.createGain();
      crackleGain.gain.value = 0.22;
      crackle.connect(hp).connect(crackleGain).connect(audioCtx.destination);
      crackle.start(now);

      // Stuttering buzz — pitched at 50/60Hz mains itself. Laptop and phone
      // speakers can't reproduce that fundamental, so it's a sawtooth (a
      // full stack of harmonics) with the lowpass at 1400Hz: dark and low,
      // but the harmonics still carry it on small speakers.
      const buzz = audioCtx.createOscillator();
      buzz.type = 'sawtooth';
      buzz.frequency.value = Math.random() < 0.5 ? 50 : 60;
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 1400;
      const buzzGain = audioCtx.createGain();
      buzzGain.gain.setValueAtTime(0, now);
      segments.forEach(({ start, on, level }) => {
        buzzGain.gain.linearRampToValueAtTime(level, now + start + 0.003);
        buzzGain.gain.setValueAtTime(level, now + start + on); // hold
        buzzGain.gain.linearRampToValueAtTime(0, now + start + on + 0.003);
      });
      buzz.connect(lp).connect(buzzGain).connect(audioCtx.destination);
      buzz.start(now);
      buzz.stop(now + total + 0.05);

      // Hiss sag + recovery
      if (noiseGain) {
        noiseGain.gain.cancelScheduledValues(now);
        noiseGain.gain.setValueAtTime(NOISE_VOLUME, now);
        noiseGain.gain.linearRampToValueAtTime(NOISE_VOLUME * 0.2, now + 0.05);
        noiseGain.gain.linearRampToValueAtTime(NOISE_VOLUME, now + dur + 0.15);
      }
    }

    // Called whenever inFilmSection changes (see the observer above) —
    // constant hum for as long as the film list is in view, faded in/out
    // rather than snapped, silent the instant the visitor scrolls back to
    // the hero or on to the footer. Only once the noise source actually
    // exists (it may not yet, before the first gesture).
    function updateAmbientNoiseForSection() {
      if (!noiseGain) return;
      if (inFilmSection) resumeAudio(); // e.g. interrupted by the hero video's sound on the way down
      noiseGain.gain.cancelScheduledValues(audioCtx.currentTime);
      noiseGain.gain.linearRampToValueAtTime(inFilmSection ? NOISE_VOLUME : 0, audioCtx.currentTime + 0.4);
    }

    // Short blip on film-to-film navigation — pitched slightly higher
    // advancing than going back, a common up/down UI-sound convention.
    function playBlip(direction) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = direction === 'down' ? 880 : 660;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.08, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    updateResponsiveVars(); // must run before init() so the first paint already uses the right sizes
    init();
    schedulePowerGlitch();

    // Default to the visitor's browser/OS language instead of always starting
    // in English — everything downstream (applyLanguage, the live sheet
    // fetches below) already knows how to apply a non-EN currentLang.
    const detectedLang = detectPreferredLanguage();
    if (detectedLang !== 'EN') {
      const langSelectEl = document.getElementById('langSelect');
      if (langSelectEl) langSelectEl.value = detectedLang;
      applyLanguage(detectedLang);
    }

    loadSheetTitles();    // async — fetches live titles from the FILM_TITLE tab, non-blocking
    loadSheetSynopses();  // async — fetches live synopses from the F_DESCRIPTION tab, non-blocking
    loadRegionsData();    // async — fetches live region lineups from the REGIONS tab, non-blocking

    // Default to the visitor's GeoIP region instead of always starting on
    // UK & IE. Async (a network round trip), so this lands after the first
    // paint and swaps the carousel over once it resolves — same pattern as
    // the sheet fetches above.
    detectRegionFromIP().then(region => {
      if (!region || region === currentRegion) return;
      const regionSelectEl = document.getElementById('regionSelect');
      if (regionSelectEl) regionSelectEl.value = region;
      applyRegion(region);
    });
    loadSlotLabels();     // async — fetches live time-of-day labels from the TOD tab, non-blocking
    loadIntroText();      // async — fetches live intro heading/quote from the INTRO_PAGE tab, non-blocking
    // Sync after layout settles
    requestAnimationFrame(() => requestAnimationFrame(() => { syncColumnCenter(); }));
    window.addEventListener('resize', () => { updateResponsiveVars(); syncColumnCenter(); });
  </script>

</body>
</html>
